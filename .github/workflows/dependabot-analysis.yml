name: Dependabot analysis

# **The second chance.** `dependabot-auto-merge.yml` judges a bump on the
# component a caret pins and queues auto-merge when it is satisfied; that is
# the fast path and it costs nothing. This workflow only ever sees what that
# path refused, and asks a different question: has the upstream version
# actually changed something we use?
#
# Two properties of this repository make the shape what it is.
#
# **The secret store.** A workflow triggered by a Dependabot pull request
# reads the *Dependabot* secret store, not the Actions one. The first is empty
# here; the second holds CLAUDE_CODE_OAUTH_TOKEN. `workflow_run` runs in the
# context of the default branch and reads the Actions store, so no secret has
# to be duplicated -- and the workflow definition always comes from `main`,
# never from the branch under analysis, which matters because Dependabot's
# github-actions pull requests edit these very files.
#
# **The privileged job never executes the pull request tree.** No npm, no
# cargo, no script from `pr/`. It reads, it writes a patch, it pushes. A
# hostile `postinstall` in a bumped package would run next to a token here;
# it runs in `ci.yml` instead, which executes everything and carries no
# secret. That is the boundary the whole design rests on, and it is why the
# fix written below is validated by CI on the next round rather than tried
# out locally.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to analyse by hand
        required: true

# Two `workflow_run` completions can name the same pull request -- a rerun,
# or two CI runs finishing moments apart -- and would otherwise launch two
# independent privileged jobs. `steps.pr.outputs.number` does not exist at
# workflow level, so the branch is the only identifier available here.
#
# `cancel-in-progress: false` is deliberate, and the opposite of `ci.yml`'s
# choice: a later stage in this workflow commits and pushes a fix, and
# cancelling a job between its commit and its push is worse than making the
# second run wait its turn. Do not "fix" this to match `ci.yml`.
#
# One case this key does not cover: for a single pull request, an automatic
# `workflow_run` keys on its branch while a manual `workflow_dispatch` keys
# on the bare number -- two different groups, so the two are not
# serialized against each other. The key cannot be made identical across
# the two triggers: at workflow level neither identifier is derivable from
# the other, since `steps.*` does not exist here to turn one into the
# other. Consequence: a manual rehearsal can run unserialized against an
# automatic run analysing the same pull request. Left this way on purpose
# rather than collapsed to one global group -- GitHub cancels a *pending*
# job that shares a group with a newer one even with `cancel-in-progress:
# false`, so a single group would make analyses of unrelated pull requests
# cancel each other's queued run. The remaining race is closed downstream,
# where it can actually do harm: the push in a later task re-reads the
# pull request's head SHA and refuses if it has moved since the SHA that
# was analysed, which makes the race harmless regardless of which group
# each run landed in.
concurrency:
  group: dependabot-analysis-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    env:
      # The identity stage 2 commits under. Round 2 is detected against it
      # in the "Decide which round we are in" step below, so the two must
      # never drift apart. Declared at job level, on purpose: a step-level
      # `env:` is scoped to that one step, so a later step -- and the plan's
      # task 7, which pushes the fix -- structurally could not have read it
      # from there.
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out the default branch, the only tree that executes
        # `workflow_run` checks out the default branch by default, which is
        # exactly what is wanted: everything that runs in this job comes from
        # `main`. The pull request head arrives later, in `pr/`, and is only
        # ever read.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve which pull request this run is about
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISPATCH_PR: ${{ inputs.pr }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          stop() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            number="$DISPATCH_PR"
            # `gh api` on a pull request number that does not exist fails
            # with a raw 404, which under `set -e` would crash the step
            # instead of giving the same readable refusal every other entry
            # condition gives. A typo here is the expected failure mode --
            # this dispatch is how the owner rehearses the feature by hand.
            head_sha="$(gh api "repos/$REPO/pulls/$number" --jq .head.sha 2>/dev/null || true)"
            [ -n "$head_sha" ] || stop "Pull request #$number does not exist."
            # The **real** conclusion of `CI` on that head, not a placeholder.
            # A manual dispatch exists so the whole path can be rehearsed
            # without waiting for Dependabot, and a rehearsal that can never
            # reach the merge step rehearses nothing: task 6 requires
            # `success` and would refuse a literal `manual` for ever. This is
            # the same value the `workflow_run` payload carries, read from the
            # API rather than from the event.
            #
            # Consequence worth knowing: a manual dispatch on a Dependabot
            # pull request whose three required checks are genuinely green can
            # therefore queue a real merge. That is the designed behaviour and
            # not a side effect -- every entry condition below still applies --
            # but it means the dispatch input is not a dry run.
            conclusion="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head_sha&per_page=1" --jq '.workflow_runs[0].conclusion // "pending"')"
            case "$conclusion" in
              success|failure) : ;;
              *) stop "CI on \`$head_sha\` concluded \`$conclusion\`; there is nothing to analyse yet." ;;
            esac
          else
            [ "$RUN_EVENT" = "pull_request" ] || stop "Not a pull request run ($RUN_EVENT); nothing to analyse."
            # A cheap pre-filter, nothing more: it skips an API call on the
            # many CI runs that are not Dependabot's. It proves nothing by
            # itself -- a branch name is set by whoever pushes it -- so it
            # must never be mistaken for authorization. The authoritative
            # check is the GitHub-verified `.user.login` test below, once
            # `number` is resolved.
            case "$HEAD_BRANCH" in
              dependabot/*) : ;;
              *) stop "Branch \`$HEAD_BRANCH\` is not Dependabot's; nothing to analyse." ;;
            esac
            # `cancelled` and `skipped` are not verdicts. ci.yml cancels the
            # in-progress run on the same ref, so our own push in stage 2
            # arrives here as a cancellation of the run it superseded.
            case "$CONCLUSION" in
              success|failure) : ;;
              *) stop "CI concluded \`$CONCLUSION\`, which says nothing about the bump." ;;
            esac
            # `workflow_run.pull_requests` is documented as unreliable when
            # the head is a fork. The head SHA is the authority.
            number="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')"
            head_sha="$HEAD_SHA"
            conclusion="$CONCLUSION"
          fi

          [ -n "$number" ] || stop "No open pull request carries $HEAD_SHA."

          # The authorization. A branch name and a commit author email are
          # both set by whoever pushes; `.user.login` and
          # `.head.repo.full_name` are not -- GitHub sets them, from its own
          # record of who opened the pull request and where its head lives.
          # `dependabot-auto-merge.yml`, the workflow this one extends,
          # already gates on `.user.login` (its `if:` on the `auto-merge`
          # job); this workflow was strictly weaker until now.
          #
          # `.user.login` is the authorization, and it is what refuses a
          # fork: a third party who forks this public repository and names
          # their branch `dependabot/anything` still opens the pull request
          # under their own login, never `dependabot[bot]`.
          #
          # `.head.repo.full_name` is kept for a narrower reason: it is what
          # makes the round-2 check below sound. `author` is a git commit
          # author email, a field whoever pushes controls; proving the head
          # branch lives in this repository means only an actor with write
          # access here can have pushed it, so that email becomes
          # trustworthy evidence there. Without that proof, the round-2
          # short-circuit would rest on a forgeable field.
          #
          # Use the REST endpoint, not `gh pr view`: `gh pr view --json
          # author` reports `app/dependabot`, not `dependabot[bot]`, and
          # would never match. `.user.login` on the REST pull request
          # carries the same literal `dependabot-auto-merge.yml` compares
          # against.
          #
          # Left unguarded here, unlike the dispatch path's lookup above: a
          # transient failure on this call -- a rate limit, an auth error --
          # must redden the job, not be swallowed into `stop`. `stop` writes
          # `skip=true`, which downstream reads as "there was nothing to
          # do"; turning an unknown into a silent skip is the fail-open
          # direction. Do not "harmonise" this with the guarded lookup
          # above -- that one guards a bad *input* (a pull request number
          # that never existed), not a transient failure.
          pr_json="$(gh api "repos/$REPO/pulls/$number")"
          login="$(printf '%s' "$pr_json" | jq -r '.user.login')"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // ""')"

          [ "$login" = 'dependabot[bot]' ] || stop "Pull request #$number was opened by \`$login\`, not Dependabot."
          [ "$head_repo" = "$REPO" ] || stop "Pull request #$number's head lives in \`$head_repo\`, not in this repository; refusing to analyse a fork."

          author="$(gh api "repos/$REPO/commits/$head_sha" --jq '.commit.author.email')"
          state="$(gh pr view "$number" --repo "$REPO" --json state --jq .state)"
          auto="$(gh pr view "$number" --repo "$REPO" --json autoMergeRequest --jq 'if .autoMergeRequest then "queued" else "open" end')"

          [ "$state" = "OPEN" ] || stop "Pull request #$number is $state."
          [ "$auto" != "queued" ] || stop "Auto-merge is already queued on #$number; the fast path settled it."

          {
            echo "number=$number"
            echo "head_sha=$head_sha"
            echo "conclusion=$conclusion"
            echo "author=$author"
          } >> "$GITHUB_OUTPUT"

      - name: Decide which round we are in
        id: state
        if: steps.pr.outputs.skip != 'true'
        env:
          AUTHOR: ${{ steps.pr.outputs.author }}
          # BOT_EMAIL comes from the job-level `env:` above, not from this
          # step; it is read here and by the push in a later task, and both
          # must see the same literal.
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "$BOT_EMAIL" ]; then
            echo 'round=2' >> "$GITHUB_OUTPUT"
            echo 'Round 2: the head commit is ours, so a fix has already been attempted.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'round=1' >> "$GITHUB_OUTPUT"
          fi

      - name: Read the bump, and ask the caret rule what it thinks
        id: bump
        if: steps.pr.outputs.skip != 'true' && steps.state.outputs.round == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # `--jq` applies once per page and `--paginate` would emit one
          # array per page, which `read-bump-metadata.mjs` cannot parse
          # (`--slurp` cannot be combined with `--jq`, or this would read
          # one array back). Unreachable in practice: `gh` requests 100
          # items per page, the endpoint caps at 250, and a Dependabot pull
          # request carries one or two commits, so this never pages. If it
          # ever did, it fails closed -- concatenated arrays crash the
          # script's `JSON.parse`, node exits non-zero, `pipefail` reddens
          # the step, and there is no verdict and therefore no merge. Do not
          # "repair" this into something that fails open.
          gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate --jq '[.[].commit.message]' > commits.json
          node .github/scripts/read-bump-metadata.mjs commits.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say what would happen, and do nothing yet
        if: steps.pr.outputs.skip != 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          ROUND: ${{ steps.state.outputs.round }}
          CONCLUSION: ${{ steps.pr.outputs.conclusion }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          {
            echo "### Plumbing only"
            echo "Pull request #$NUMBER, round $ROUND, CI concluded \`$CONCLUSION\`."
            echo "Bump: ${SUMMARY:-(not read)}"
            echo "No analysis and no merge: the analysis step arrives in task 5."
          } >> "$GITHUB_STEP_SUMMARY"
