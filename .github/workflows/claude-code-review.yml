name: Claude Code Review

# **A review that says nothing used to be indistinguishable from one that
# never ran.** `claude-code-action` reports `outcome=success` whenever the SDK
# returns, and the `code-review` plugin is silent by design on a clean pull
# request ("if there are no issues that meet this criteria, do not proceed").
# So a green check meant one of three things and named none of them. Measured
# on this repository, all three green, none commented:
#
#   PR #35, attempt 1:  3 turns,  12.7s, $0.10,  0 denials -- never started
#   PR #35, attempt 2: 24 turns,  95s,   $0.55, 11 denials -- prevented
#   PR #22:            54 turns, 319s,   $2.07, 12 denials -- worked
#
# Two things were wrong and both are fixed below: the review could not run,
# and nothing reported what it did. Across the whole repository only two runs
# had ever produced a comment.
#
# **It is asked for now, not automatic.** Say `/review` or `@claude-review`
# in a comment on a pull request and this runs; say nothing and nothing
# happens. Reviewing every push was spending tokens on changes nobody was
# waiting on a verdict for.
#
# **Why two spellings, and why they are matched differently.** `/review` is a
# command, so it is read at the START of the comment: `contains` would fire on
# any comment quoting a URL that happens to hold `/review` -- a link to
# `.../pull/41/reviews` is enough -- and a review nobody asked for is the
# thing this trigger exists to stop. `@claude-review` is a mention, so it is
# read anywhere in the comment, the way a mention is written. It is also not a
# GitHub account (checked: 404), unlike `@review`, which is an organisation
# and would have rendered every request as a link to strangers.
#
# Two consequences of the trigger, both deliberate:
#
# 1. **A comment-triggered run is not a check on the pull request.** It shows
#    in the Actions tab and not in the merge box, so a red job no longer
#    blocks anything. The red is kept anyway -- it is still what distinguishes
#    a review that failed from one that found nothing, and the verdict comment
#    says which on the pull request itself.
# 2. **Dependabot is untouched.** This workflow already skipped bots, so the
#    bump pull requests never reached it; `dependabot-analysis.yml` and
#    `dependabot-auto-merge.yml` are what handle those, automatically, and
#    nothing here changes that.
#
# `claude.yml` answers `@claude` and does whatever the comment asks. The two
# do not overlap, and keeping that true takes an explicit exclusion over
# there: `@claude-review` CONTAINS `@claude`, so without it every request for
# a review would start a second, unasked-for session alongside this one.

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # **`issue_comment` fires on issues too**, where there is nothing to
    # review: `github.event.issue.pull_request` is the field that exists only
    # on a pull request's comments, and is how the two are told apart.
    #
    # **No review triggered by a bot**, keyed on `user.type` rather than on a
    # list of logins so a bot added later is covered without an edit here.
    # `dependabot-analysis.yml` writes comments on the bump pull requests, and
    # one of them quoting a diff that happens to carry either spelling would
    # otherwise start a review nobody asked for, on the one class of pull
    # request this repository has deliberately excluded.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/review') ||
       contains(github.event.comment.body, '@claude-review'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write`, both of them, and not the `read` this workflow shipped with:
      # the review comments on the pull request and the verdict step below
      # posts and edits its own comment. Inline review comments live under the
      # pulls API and the verdict comment under the issues API, so both are
      # needed and neither is spare.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The verdict step counts what Claude posted *during this run*. Taken
      # before the action starts, so a comment left on an earlier push cannot
      # be counted as this run's output -- which would report `findings` for a
      # review that in fact said nothing this time.
      - name: Mark where this run starts
        id: since
        shell: bash
        run: |
          set -euo pipefail
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # **Does this pull request edit the workflow the action validates?** The
      # action compares the running file against the default branch's copy
      # byte for byte and skips when they differ, so a pull request touching
      # this file may not be reviewable at all -- and reddening that would be
      # a false alarm on exactly the changes that need the most care. Measured
      # on PR #36: "Skipping action due to workflow validation", no model
      # invoked.
      #
      # **Asked of the pull request, not of the workspace.** Under the old
      # `pull_request` trigger a `git diff` against the default branch was the
      # same question the server asks, because the workspace held the pull
      # request. Under `issue_comment` the workspace starts on the default
      # branch -- the action checks the pull request out afterwards, for
      # itself -- so that diff would now compare the default branch with
      # itself and answer `false` every time, quietly retiring the branch it
      # guards. The file list of the pull request is the same question asked
      # of something this trigger has not moved.
      #
      # It may well be that this case can no longer happen, the validated file
      # now being the default branch's own. That is a guess about someone
      # else's server, and the cost of being wrong is a red job and a comment
      # saying a pull request was not reviewed when it was -- so the branch
      # stays until a run proves it unreachable.
      - name: Does this pull request change the review workflow itself?
        id: selfchange
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # One filename per line across every page, so the per-page `--jq`
          # trap does not apply. `grep -q` exits 1 when it matches nothing,
          # which is a legitimate answer here and not an error: inside `if`
          # it does not trip `set -e`.
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -qxF '.github/workflows/claude-code-review.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "This pull request edits the review workflow; the action may refuse to run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unpinned, and that is a known cost rather than an oversight: the
          # marketplace is cloned from `main` on every run, so the plugin can
          # change under a workflow file that has not. Visible in this
          # repository's own history -- PR #22's comment is an `h3` heading and
          # PR #29's an `h2`, from two different versions of the same plugin.
          # The action offers no version pin for a plugin; the verdict step
          # below is what turns a behaviour change into a red job instead of a
          # silent one.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          # **`bypassPermissions`, not an allow-list.** This line used to read
          # `--allowedTools "mcp__github_inline_comment__create_inline_comment"`
          # -- one tool, while the plugin's procedure needs `gh pr diff`,
          # `gh pr view`, `git blame`, `git log` and a dozen subagents. Every
          # one of those was refused, which is what the 11 and 12 denials
          # above are, and the agent gave up after 3 turns one time and 24 the
          # next. An allow-list also cannot anticipate what the next version
          # of an unpinned plugin will reach for, so it would silently rot.
          #
          # **What bounds the trade, now that the trigger is a comment.** It
          # used to be the `pull_request` trigger itself. That argument is
          # gone: `issue_comment` runs from the default branch with the
          # repository's own token, and the action then checks the pull
          # request out and runs its code under this very permission mode. So
          # the bound is elsewhere, and it is worth naming because it is now
          # the only one:
          #
          #   - the action resolves the commenter and refuses anyone without
          #     write access ("Checking permissions for actor" / "Permission
          #     level retrieved" in every run log), so a passer-by on a public
          #     repository cannot start this by commenting;
          #   - the bot filter above keeps an automated comment from doing it;
          #   - `contents` stays `read`, so nothing here can write a ref.
          claude_args: '--permission-mode bypassPermissions'

      # **The step that ends the silence.** Runs whatever the review did,
      # including when the action itself failed -- that case has no execution
      # file at all, which `review-verdict.mjs` reports rather than skips.
      - name: Say what the review did
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SINCE: ${{ steps.since.outputs.at }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          WORKFLOW_CHANGED: ${{ steps.selfchange.outputs.changed }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # What Claude left on the pull request since this run began. Both
          # APIs, because an inline finding and a summary comment live in
          # different places and either one means the review spoke.
          #
          # The timestamps are GitHub's own ISO-8601 UTC, so a string
          # comparison is a chronological one. `github-actions[bot]` -- the
          # author of the verdict comment posted below -- is not `claude[bot]`
          # and so cannot be counted as a finding by a later run.
          #
          # **The action's own progress comment must not count as a finding.**
          # On a comment trigger -- and only there -- the action posts
          # "Claude finished @user's task in 1m 56s" under `claude[bot]`
          # itself, so every run would otherwise report `findings` and no run
          # could ever be `clean`. It is excluded by the run id it links to
          # rather than by that sentence: the wording is someone else's to
          # change, while a comment pointing at this very run is by
          # construction this run talking about itself. Verified on PR #26,
          # where the body carries no HTML marker to key on and the job link
          # is the only stable handle.
          # **Summed across pages, not read as one number.** `gh api
          # --paginate` emits one JSON document PER PAGE and `--jq` runs
          # against each separately ("Each page is a separate JSON array"), so
          # a pull request past the 30-comment page size yields several lines
          # and `$((a + b))` would fail on the lot. `awk` sums whatever
          # arrives, one page or six, and prints 0 for none.
          #
          # **`pipefail` is load-bearing here, not decoration.** `awk` prints
          # `0` and exits 0 whether the API returned an empty page or nothing
          # at all, so without it a failed `gh` call reads as "Claude left no
          # comments" -- a clean verdict on a review nobody measured, which is
          # the exact silence this file replaces. Measured while writing it: a
          # TLS timeout on the `gh` call printed `0` and returned success.
          filter="[.[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"$SINCE\") | select((.body | contains(\"actions/runs/$RUN_ID\")) | not)] | length"
          sum_pages() { gh api "$1" --paginate --jq "$filter" | awk '{ total += $1 } END { print total + 0 }'; }
          inline=$(sum_pages "repos/$REPO/pulls/$PR/comments")
          summary=$(sum_pages "repos/$REPO/issues/$PR/comments")
          count=$((inline + summary))
          echo "Claude left $inline inline comment(s) and $summary summary comment(s) during this run."

          # The script exits 1 on `failed` and 2 on a usage error, so it is
          # run without `set -e` killing the job before the comment is posted.
          # Posting the verdict is the whole point; reddening the job comes
          # after it, never instead of it.
          status=0
          node .github/scripts/review-verdict.mjs "${EXECUTION_FILE:-}" "$count" "${WORKFLOW_CHANGED:-false}" > verdict.md || status=$?

          # Exit 2 is a usage error: the script wrote its complaint to stderr
          # and nothing to stdout. An empty body is a 422 from the comments
          # API, so posting it would redden this step with a message about
          # JSON rather than about the review. Fail, but say why on the pull
          # request like every other path here does.
          if [ ! -s verdict.md ]; then
            {
              echo '<!-- claude-code-review-verdict -->'
              echo '## Code review'
              echo
              echo '**The verdict step failed, so this pull request has not been reviewed.**'
              echo
              echo 'See the job log for the error.'
            } > verdict.md
            status=1
            # The script exited before it could write the summary, so this
            # path writes its own -- an empty run summary next to a red job is
            # the silence being replaced, in miniature.
            cat verdict.md >> "$GITHUB_STEP_SUMMARY"
          fi

          # Only to the log here. The run summary is written by the script
          # itself, which appends the verdict AND the per-tool breakdown --
          # having both places append would print the verdict twice.
          cat verdict.md

          # Sticky: edit the previous verdict rather than stack one per push.
          # The marker is matched against the body rather than the author, so
          # a repository with several bot commenters still finds it.
          #
          # Same per-page trap as above, handled the other way: the filter
          # emits one id per line across every page and `tail -n 1` takes the
          # most recent. A `last` inside the jq would pick the last of EACH
          # page and hand several ids to the PATCH below.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- claude-code-review-verdict -->")) | .id' | tail -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@verdict.md > /dev/null
            echo "Updated verdict comment $existing."
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@verdict.md > /dev/null
            echo "Posted a new verdict comment."
          fi

          exit "$status"
