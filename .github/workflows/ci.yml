name: CI

# The five commands of docs/development.md, on Ubuntu: the SDK tests open
# Unix sockets, so no Windows runner is possible. scripts/ci-local.sh runs
# the same commands in the same order — if one of the two changes, the
# other must follow.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI (build, typecheck, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - name: Publish the dist bundles for the Rust jobs
        # dist/ is git-ignored: this job is the only producer, the others
        # download. Without dist, build.rs embeds a stub and settles for a
        # warning — see "Refuse an embedded stub" below.
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          if-no-files-found: error
          path: |
            web/app/dist
            crates/*/ui/dist

  rust:
    name: Rust (build, clippy, tests)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
      - name: Refuse an embedded stub
        # build.rs replaces a missing dist with a stub and only emits a
        # warning: here it is an error, otherwise CI would validate a binary
        # without a UI.
        run: test -f web/app/dist/index.html && ls crates/*/ui/dist/ui.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test tools
        # ffmpeg: otherwise four tests silently skip themselves.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    name: End-to-end journeys (Playwright)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audio player for the journeys
        # docs/development.md: the e2e tests really play through the radio plugin.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - run: cargo build --workspace
      - run: npx playwright install --with-deps chromium
        working-directory: web/app
      - run: npm run e2e
        working-directory: web/app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/app/playwright-report
            web/app/test-results

  release:
    name: armv7 binaries (cross)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --release --workspace --target armv7-unknown-linux-gnueabihf
      - name: Gather what deploy.sh expects
        run: |
          mkdir -p release-bundle
          cp target/armv7-unknown-linux-gnueabihf/release/ritornello-core release-bundle/
          cp target/armv7-unknown-linux-gnueabihf/release/ritornello-plugin-* release-bundle/
          ls -l release-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ritornello-armv7-${{ github.ref_name }}
          path: release-bundle
