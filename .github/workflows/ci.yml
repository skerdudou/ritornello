name: CI

# The five commands of docs/development.md, on Ubuntu: the SDK tests open
# Unix sockets, so no Windows runner is possible. scripts/ci-local.sh runs
# the same commands in the same order — if one of the two changes, the
# other must follow.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI (build, typecheck, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - name: Publish the dist bundles for the Rust jobs
        # dist/ is git-ignored: this job is the only producer, the others
        # download. Without dist, build.rs embeds a stub and settles for a
        # warning — see "Refuse an embedded stub" below.
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          if-no-files-found: error
          path: |
            web/app/dist
            crates/*/ui/dist

  rust:
    name: Rust (build, clippy, tests)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - name: Refuse an embedded stub
        # build.rs replaces a missing dist with a stub and only emits a
        # warning: here it is an error, otherwise CI would validate a binary
        # without a UI.
        run: test -f web/app/dist/index.html && ls crates/*/ui/dist/ui.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test tools
        # ffmpeg: otherwise nine tests silently skip themselves (grep -rc
        # "ffmpeg missing" across the repo, excluding the e2e comment that
        # merely names the same failure mode).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    name: End-to-end journeys (Playwright)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audio player for the journeys
        # docs/development.md: the e2e tests really play through the radio plugin.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - run: cargo build --workspace
      - run: npx playwright install --with-deps chromium
        working-directory: web/app
      - run: npm run e2e
        working-directory: web/app
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/app/playwright-report
            web/app/test-results

  release:
    name: Release archives (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refuse a tag that does not match the workspace version
        # Without this, v0.3.0 pushed on a workspace still at 0.2.0 would
        # produce 33 archives named after a version nothing carries — and the
        # mistake would only surface on a device.
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "${{ github.ref_name }}" ] \
            || { echo "tag ${{ github.ref_name }} != workspace version $v" >&2; exit 1; }
      - run: cargo install cross --locked
      - run: cross build --release --workspace --target ${{ matrix.target }}
      - run: ./scripts/package-release.sh ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: release/${{ matrix.arch }}

  publish:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      # The only privilege this workflow asks for, and only here.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: One checksum file for every asset
        run: cd assets && sha256sum *.tar.gz > SHA256SUMS && ls -l
      - name: Create the draft release
        # A draft, not a publication: the notes must be read before anyone
        # installs from them — that is where "Nothing to do" or "Action
        # required" is decided. `gh` ships on the runner, so no third-party
        # action is involved in the one step that holds write permission.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file .github/release-notes-template.md \
            assets/*
