name: CI

# The five commands of docs/development.md, on Ubuntu: the SDK tests open
# Unix sockets, so no Windows runner is possible. scripts/ci-local.sh runs
# the same commands in the same order — if one of the two changes, the
# other must follow.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The floor, so that the one escalation below is a real one. Without this
# block every job would inherit the repository's default token permissions —
# read/write-all on many repositories — and `release`, which runs
# `cargo install cross` and `cross build` (arbitrary build scripts, on a tag
# push), would hold a token that can write to the repository for no reason.
permissions:
  contents: read

jobs:
  web:
    name: Web UI (build, typecheck, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - name: Publish the dist bundles for the Rust jobs
        # dist/ is git-ignored: this job is the only producer, the others
        # download. Without dist, build.rs embeds a stub and settles for a
        # warning — see "Refuse an embedded stub" below.
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          if-no-files-found: error
          path: |
            web/app/dist
            crates/*/ui/dist

  rust:
    name: Rust (build, clippy, tests)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - name: Refuse an embedded stub
        # build.rs replaces a missing dist with a stub and only emits a
        # warning: here it is an error, otherwise CI would validate a binary
        # without a UI.
        run: test -f web/app/dist/index.html && ls crates/*/ui/dist/ui.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test tools
        # ffmpeg: otherwise nine tests silently skip themselves (grep -rc
        # "ffmpeg missing" across the repo, excluding the e2e comment that
        # merely names the same failure mode).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    name: End-to-end journeys (Playwright)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audio player for the journeys
        # docs/development.md: the e2e tests really play through the radio plugin.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - run: cargo build --workspace
      - run: npx playwright install --with-deps chromium
        working-directory: web/app
      - run: npm run e2e
        working-directory: web/app
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/app/playwright-report
            web/app/test-results

  release:
    name: Release archives (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refuse a tag that does not match the product number
        # This number names the delivery, not any component: each shipped
        # component carries its own version instead (see [package] in its own
        # Cargo.toml), and the guard that a component stays on the product's
        # major.minor lives elsewhere — version_coherence.rs and
        # package-release.sh. Without this step, v0.3.0 pushed on a workspace
        # still at 0.2.0 would produce archives named after a version nothing
        # carries — and the mistake would only surface on a device.
        #
        # The tag travels through the environment rather than being spliced
        # into the script: `${{ }}` is substituted before the shell parses the
        # line, so a ref name is shell text, while "$TAG" is one word whatever
        # it contains.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$TAG" ] \
            || { echo "tag $TAG != product number $v" >&2; exit 1; }
      - run: cargo install cross --locked
      - run: cross build --release --workspace --target ${{ matrix.target }}
      - run: ./scripts/package-release.sh ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: release/${{ matrix.arch }}

  publish:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      # The only privilege this workflow asks for, and only here.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, tags included: GitHub names the previous
          # published release below, but `changed-components.sh` still reads
          # that release's Cargo.toml files via `git show <tag>:...`, which
          # needs the tag and the history it points into locally. The default
          # shallow checkout has neither.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Keep only the components whose version moved
        id: changed
        # A release carries what changed, and nothing else — so a fix in one
        # plugin does not re-publish eleven archives and does not make the
        # device replace components that are identical to what it already runs.
        #
        # The bundle of all plugins stays in every release: it is nobody's
        # component, it serves the first install in one command, and the
        # updater ignores it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The previous PUBLISHED release, asked of GitHub and not of git.
          # `git describe` answers "the previous tag reachable from here",
          # which is a different question: this workflow creates drafts on
          # purpose, the device's fold discards drafts, and an abandoned
          # draft's tag exists in git all the same — so git's answer would
          # judge a component unchanged whose only publication was a draft
          # nobody published, and drop its archive from the next release. It
          # would also count this repository's backup tags as releases.
          #
          # This step runs before `gh release create`, so the newest published
          # release is genuinely the previous one. Empty on a first release,
          # which publishes everything.
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous published release: ${prev:-none}"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          ./scripts/changed-components.sh $prev > changed.txt
          cat changed.txt
          mkdir keep
          while read -r c; do
            mv assets/"$c"-*.tar.gz keep/
          done < changed.txt
          # Nobody's component, kept in every release.
          mv assets/ritornello-plugins-*.tar.gz keep/
          rm -rf assets
          mv keep assets
          ls -l assets
      - name: Refuse a unit/rule/updater change announced as "Nothing to do"
        # The one place in this workflow that *knows* a systemd unit, a
        # polkit rule or the updater changed — the updater cannot write any
        # of those itself, so the release notes are the only place a manual
        # step ever gets said. See scripts/release-notes-guard.sh for the
        # rule; kept out of this file so it can be run and read on a
        # development machine instead of discovered by pushing a tag.
        run: ./scripts/release-notes-guard.sh "${{ steps.changed.outputs.prev }}"
      - name: One checksum file for every asset
        # This step runs after the filtering above, not before: SHA256SUMS
        # must describe only what this release carries. The core reads a
        # component's checksum from the release that carries its archive, and
        # a checksum file listing archives absent from this release would
        # describe archives that live elsewhere.
        run: cd assets && sha256sum *.tar.gz > SHA256SUMS && ls -l
      - name: Create the draft release
        # A draft, not a publication: the notes must be read before anyone
        # installs from them — that is where "Nothing to do" or "Action
        # required" is decided. `gh` ships on the runner, so no third-party
        # action is involved in the one step that holds write permission.
        #
        # `TAG` through the environment, for the same reason as in `release`:
        # a ref name spliced into the script by `${{ }}` becomes shell text.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file .github/release-notes-template.md \
            assets/*
