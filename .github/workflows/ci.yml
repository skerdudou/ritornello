name: CI

# The five commands of docs/development.md, on Ubuntu: the SDK tests open
# Unix sockets, so no Windows runner is possible. scripts/ci-local.sh runs
# the same commands in the same order — if one of the two changes, the
# other must follow.
#
# One exception, scoped to one crate: the `installer` job builds and tests
# `ritornello-install` alone on Linux, Windows and macOS, because that
# program runs on a person's workstation, not on the device. The workspace
# as a whole stays Linux-only.
#
# Two kinds of tag publish something. `vX.Y.Z` is the product's release (the
# `release`, `language-packs` and `publish` jobs). `installer-vX.Y.Z` is the
# installer's own, on a channel of its own (`publish-installer`): it rarely
# changes, so it is not re-attached to every product release.

on:
  push:
    branches: [main]
    tags: ['v*', 'installer-v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The floor, so that the one escalation below is a real one. Without this
# block every job would inherit the repository's default token permissions —
# read/write-all on many repositories — and `release`, which runs
# `cargo install cross` and `cross build` (arbitrary build scripts, on a tag
# push), would hold a token that can write to the repository for no reason.
permissions:
  contents: read

jobs:
  web-build:
    name: Web UI (build)
    # Everything the Rust jobs wait for, and nothing else: the build, what
    # guards it, and the dist artifact. The typecheck and the vitest suites
    # (~3.5 of the 4 minutes the whole web job took, measured) run in
    # `web-test`, beside `rust` and `e2e` rather than before them. Neither of
    # those reads a test result; both read the built dist.
    #
    # Not on an installer tag: the installer embeds no web UI and `rust` and
    # `e2e` wait for this job, so skipping it skips all three. The installer
    # job below tests and builds the one crate that tag publishes.
    if: ${{ !startsWith(github.ref, 'refs/tags/installer-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Workflow scripts (node:test)
        # No dependency at all -- `node:test` is built in -- so these run
        # before `npm ci` and cost a second. They live in this job rather
        # than a new one because `main` requires three checks by name: a new
        # job would need branch protection edited before it could ever block
        # anything.
        #
        # **Named explicitly, AND existence-checked before running --
        # naming alone is not the guard.** `*.test.mjs` was refused earlier
        # because `node --test` exits 0 when a glob matches nothing. Naming
        # the files instead looks like it fixes that, but it does not:
        # `node --test` ALSO exits 0 when some, but not all, of several named
        # files are missing -- it just runs a smaller suite and says nothing.
        # Measured on this exact command when the list held three files: all
        # three present -> 58 tests, exit 0; `check-guards.test.mjs` renamed
        # away -> 27 tests REMAINING, exit 0; `classify-bump.test.mjs` renamed
        # away too -> 13 remaining, exit 0; all three renamed away -> exit 1
        # (the only case that fails on its own). Those are counts of what was
        # left, not the size of what went missing -- a rewrite of this comment
        # once read them the other way round and made it contradict itself.
        # The list is nine files now, 174 tests of which 6 skip off Linux, and
        # the shape of the failure is the same: a one-file rename is the
        # realistic mistake, and it reproduces exactly the silent-green that naming the
        # files was supposed to prevent. So this step does not trust
        # `node --test`'s own exit code for that: the loop below asserts each
        # path exists, named once, and fails loudly with the missing path
        # before `node` ever runs. A bare directory argument has the opposite failure,
        # which is why this was a glob originally: node reports `Cannot find
        # module .../.github/scripts` and emits a *failing test* named after
        # the directory -- the existence check below fails earlier and more
        # plainly than that too.
        #
        # `shell: bash`: GitHub's default shell has no `pipefail`, and while
        # nothing here pipes, `set -euo pipefail` is this repository's one
        # habit for these steps regardless, so the same explicit shell they
        # all use.
        #
        # **After `setup-node`, not before it.** Before `setup-node` runs
        # this step would use the runner image's ambient Node -- which was 20
        # until a migration in May 2026. Running here means the version is
        # the one this file declares, not one the image happens to ship.
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            .github/scripts/analysis-memo.test.mjs
            .github/scripts/check-guards.test.mjs
            .github/scripts/check-workflow-permissions.test.mjs
            .github/scripts/classify-bump.test.mjs
            .github/scripts/classify-round.test.mjs
            .github/scripts/hash-git-dir.test.mjs
            .github/scripts/read-bump-metadata.test.mjs
            .github/scripts/review-triggers.test.mjs
            .github/scripts/review-verdict.test.mjs
          )
          for f in "${tests[@]}"; do
            [ -f "$f" ] || { echo "Missing test file: $f" >&2; exit 1; }
          done
          node --test "${tests[@]}"
      - run: npm ci
      - name: Check the lockfile
        # npm ci proves the lock installs, not that the tree it describes can
        # be loaded. A peer that npm is happy with can still be unreachable by
        # Node's own resolution, and that failure shows up here rather than on
        # a developer's machine: a worktree lives inside the main checkout, so
        # Node walks up into its node_modules and the build passes locally.
        run: node scripts/check-lockfile.mjs
      - run: npm run build --workspaces --if-present
      - name: Publish the dist bundles for the Rust jobs
        # dist/ is git-ignored: this job is the only producer, the others
        # download. Without dist, build.rs embeds a stub and settles for a
        # warning — see "Refuse an embedded stub" below.
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          if-no-files-found: error
          path: |
            web/app/dist
            crates/*/ui/dist

  web-test:
    name: Web UI (typecheck, vitest)
    # The other half of the former `web` job, run in parallel with `rust` and
    # `e2e` instead of ahead of them. It is still a gate: `publish` needs it,
    # so no tag drafts a release over a red web suite, and `main` requires it
    # by name.
    #
    # It repeats `npm ci` (cached) instead of passing a node_modules
    # artifact, and does not build: vue-tsc and vitest read sources, not dist.
    # Same installer-tag skip as `web-build`.
    if: ${{ !startsWith(github.ref, 'refs/tags/installer-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --workspaces --if-present

  rust:
    name: Rust (build, clippy, tests)
    needs: web-build
    # 24.04, not -latest: the apt cache key ignores the OS release and its
    # hits are extracted straight into /, so the pin and the apt caches (and
    # the Chromium list in e2e) move together: change both, bump `version:`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - name: Refuse an embedded stub
        # build.rs replaces a missing dist with a stub and only emits a
        # warning: here it is an error, otherwise CI would validate a binary
        # without a UI.
        run: test -f web/app/dist/index.html && ls crates/*/ui/dist/ui.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test tools
        # ffmpeg: otherwise nine tests silently skip themselves (grep -rc
        # "ffmpeg missing" across the repo, excluding the e2e comment that
        # merely names the same failure mode).
        # Cached by the action, keyed on the package list and `version`: a warm
        # run restores the .debs and runs no `apt-get update`. Bump `version`
        # to throw the cache away by hand.
        # Pinned by commit SHA, unlike the actions/* pinned by tag: this is a
        # third-party action that restores .debs and runs their install scripts.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ffmpeg
          # Postinst scripts register libblas.so.3 (update-alternatives):
          # without them a restored ffmpeg cannot start, and the tests that
          # need it skip themselves silently.
          # Maintainer scripts restored from the cache run as root on the
          # runner: acceptable only in these test-only jobs (read-only token,
          # no secrets). Never copy this into a job that builds something
          # people download.
          execute_install_scripts: true
          # Cached .debs get no Ubuntu security or point updates until this
          # is bumped: fine for test tooling.
          version: 1
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The release-notes guard, on its own cases
        # The guard itself only runs at release time; this is what proves,
        # on every push, that each path it watches still makes it refuse.
        run: ./scripts/release-notes-guard.sh --self-test

  e2e:
    name: End-to-end journeys (Playwright)
    needs: web-build
    # 24.04, not -latest: the apt cache key ignores the OS release and its
    # hits are extracted straight into /, so the pin and the apt caches (and
    # the Chromium list in e2e) move together: change both, bump `version:`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audio player for the journeys
        # docs/development.md: the e2e tests really play through the radio plugin.
        # Cached like the rust job's ffmpeg: the mirrors, not the tests, were
        # the jitter (29 s to 402 s for this one step).
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: mpv ffmpeg
          # Their dependencies (libblas3 and friends) register libblas.so.3
          # through update-alternatives in a postinst script: without
          # running those scripts a restored cache leaves ffmpeg and mpv
          # unable to start ("cannot open shared object file", measured).
          # Maintainer scripts restored from the cache run as root on the
          # runner: acceptable only in these test-only jobs (read-only token,
          # no secrets). Never copy this into a job that builds something
          # people download.
          execute_install_scripts: true
          # Cached .debs get no Ubuntu security or point updates until this
          # is bumped: fine for test tooling.
          version: 1
      - name: Chromium system libraries
        # What `npx playwright install-deps chromium` would apt-install on
        # ubuntu-latest (24.04), read from nativeDeps.ts of @playwright/test
        # 1.63: its `chromium` libraries, then its `tools` (fonts and xvfb).
        # Listed here so the apt cache serves them; if Playwright is bumped
        # and Chromium fails to launch on a missing library, compare with
        # `npx playwright install-deps --dry-run chromium` and bump `version`.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1
            libfreetype6 xfonts-cyrillic xfonts-scalable fonts-liberation
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf
            fonts-freefont-ttf
          # Cached .debs get no Ubuntu security or point updates until this
          # is bumped: fine for test tooling.
          version: 1
      - run: cargo build --workspace
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web/app
      - name: Chromium browser
        # Keyed on the OS and the exact @playwright/test version, which alone
        # decides which Chromium build it wants. On a hit nothing is
        # downloaded, and `playwright install` (which prunes old browsers
        # before fetching) is not run at all.
        id: browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: web/app
      - run: npm run e2e
        working-directory: web/app
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/app/playwright-report
            web/app/test-results

  installer:
    name: Installer (${{ matrix.target }})
    # On every event, not only on a tag: this is what proves, before a merge,
    # that the workstation installer still compiles and passes its own tests
    # on each system a person may run it from, down to its packaging and
    # upload; only `publish-installer`, on an installer tag, turns the archives into release
    # assets. Needs nothing: the crate embeds no web UI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, statically linked: a glibc binary built on this Ubuntu
          # refuses to start on a distribution with an older glibc, such as
          # Debian 12. WSL takes this one too.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            test: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            test: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Built on the Apple Silicon runner for the older Intel Macs. Its
          # tests are not run: the binary of the leg above passes the same
          # suite from the same sources.
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        # `ring`, under rustls, compiles C: it needs musl-gcc for these targets.
        if: runner.os == 'Linux'
        # No apt cache here, unlike the test jobs: this leg builds the
        # installer people download.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo clippy -p ritornello-install --target ${{ matrix.target }} --all-targets -- -D warnings
      - if: matrix.test
        run: cargo test -p ritornello-install --target ${{ matrix.target }}
      - run: cargo build --release -p ritornello-install --target ${{ matrix.target }}
      - name: Package
        # On every event, like the build above: the packaging and the upload
        # are proven by each pull request rather than first tried on the day
        # of a release. Only `publish-installer`, which is tag-only, turns them into
        # release assets.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        # Named after the full target triple, never a device label (armv7,
        # arm64, x86_64): a device reads every asset of a release, and
        # `an_installer_archive_is_never_a_component` in update/release.rs
        # pins that it ignores these names. **No version in the name, on
        # purpose**: the same name in every installer release is what lets the
        # README link to `releases/download/installer/<name>` once and for all
        # (pinned by `the_readme_links_every_installer_the_ci_publishes`). No
        # device fetches these, so nothing compares their versions. `.zip` for
        # Windows, where it is the archive a person can open; `.tar.gz`
        # elsewhere, which keeps the executable bit.
        run: |
          name="ritornello-install-$TARGET"
          mkdir out
          cd "target/$TARGET/release"
          case "$TARGET" in
            *windows*) 7z a -tzip "../../../out/$name.zip" ritornello-install.exe ;;
            *) tar czf "../../../out/$name.tar.gz" ritornello-install ;;
          esac
          ls -l ../../../out
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: out

  installer-ok:
    name: Installer (all targets)
    # One check that stands for the five legs above, so that branch
    # protection can require it by a single stable name: `main` requires
    # checks by name, and a check that is not required does not stop
    # Dependabot's auto-merge (`gh pr merge --auto` waits for required checks
    # only). Without it, a dependency bump that breaks the Windows or macOS
    # build could land on `main` and first be seen when `publish-installer`, which
    # needs every leg, refuses the next release.
    #
    # `always()` so that a failed or cancelled leg makes THIS job fail rather
    # than be skipped: a skipped required check counts as passing.
    if: always()
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - name: Every installer leg passed
        env:
          RESULT: ${{ needs.installer.result }}
        # A block scalar: on a plain `run:` line, the `: ` inside the message
        # is read by YAML as a new key, and the whole workflow fails to load
        # (measured on this very job's first push).
        run: |
          test "$RESULT" = success || { echo "installer legs: $RESULT" >&2; exit 1; }

  release:
    name: Release archives (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    # Starts as soon as the web is built: it reads `dist-web` and nothing
    # rust or e2e produce (its cargo cache is its own). The test gate sits on
    # `publish`, which needs rust, e2e and web-test: archives built from a
    # red tree are never drafted, let alone published.
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Refuse a tag that does not match the product number
        # This number names the delivery, not any component: each shipped
        # component carries its own version instead (see [package] in its own
        # Cargo.toml), and the guard that a component stays on the product's
        # major.minor lives elsewhere — version_coherence.rs and
        # package-release.sh. Without this step, v0.3.0 pushed on a workspace
        # still at 0.2.0 would produce archives named after a version nothing
        # carries — and the mistake would only surface on a device.
        #
        # The tag travels through the environment rather than being spliced
        # into the script: `${{ }}` is substituted before the shell parses the
        # line, so a ref name is shell text, while "$TAG" is one word whatever
        # it contains.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$TAG" ] \
            || { echo "tag $TAG != product number $v" >&2; exit 1; }
      - run: cargo install cross --locked
      - run: cross build --release --workspace --target ${{ matrix.target }}
      - run: ./scripts/package-release.sh ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: release/${{ matrix.arch }}

  language-packs:
    name: Language pack archives
    if: startsWith(github.ref, 'refs/tags/v')
    # No `needs:` at all: it packages text and reads no build output. The
    # test gate sits on `publish`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain, no cross, no dist: a pack is text. This job exists
      # precisely because a pack has no architecture -- inside the per-arch
      # matrix, three runs would produce the same file name and collide when
      # `publish` merges their directories.
      - run: ./scripts/package-release.sh --languages
      - uses: actions/upload-artifact@v7
        with:
          name: release-languages
          if-no-files-found: error
          path: release/languages

  publish:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    # Every test gate lives here: nothing is drafted unless the Rust suite, the
    # end-to-end journeys and the web tests all passed.
    needs: [release, language-packs, rust, e2e, web-test]
    runs-on: ubuntu-latest
    permissions:
      # The only privilege this workflow asks for, and only here.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, tags included: GitHub names the previous
          # published release below, but `changed-components.sh` still reads
          # that release's Cargo.toml files via `git show <tag>:...`, which
          # needs the tag and the history it points into locally. The default
          # shallow checkout has neither.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Keep only the components whose version moved
        id: changed
        # A release carries what changed, and nothing else — so a fix in one
        # plugin does not re-publish eleven archives and does not make the
        # device replace components that are identical to what it already runs.
        #
        # The bundle of all plugins stays in every release: it is nobody's
        # component, it serves the first install in one command, and the
        # updater ignores it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not spliced into the script: see the
          # tag check above.
          TAG: ${{ github.ref_name }}
        run: |
          # The previous PUBLISHED release, asked of GitHub and not of git.
          # `git describe` answers "the previous tag reachable from here",
          # which is a different question: this workflow creates drafts on
          # purpose, the device's fold discards drafts, and an abandoned
          # draft's tag exists in git all the same — so git's answer would
          # judge a component unchanged whose only publication was a draft
          # nobody published, and drop its archive from the next release. It
          # would also count this repository's backup tags as releases.
          #
          # This step runs before `gh release create`, so the newest published
          # release is genuinely the previous one. Empty on a first release,
          # which publishes everything.
          #
          # What it is measured against depends on the tag, and the decision
          # lives in `release-tags.sh base-for` so it can be run and broken
          # on a development machine:
          #
          # - a PRERELEASE tag against the newest published product release,
          #   prereleases included, so a beta carries only what moved since
          #   the previous beta. That is safe because a device that asked for
          #   prereleases folds over them too and finds each component in
          #   the newest release carrying it, `ritornello-install` locates
          #   each archive the same way, and the catalogue and the inventory
          #   describe every component whatever this release carries;
          # - a FINISHED tag against the newest FINISHED release, which keeps
          #   an invariant worth naming: a component that a beta shipped had
          #   changed since that same baseline, so the final delivery ships
          #   it too and no tester is left holding a `-beta` binary that
          #   nothing will ever replace.
          #
          # The installer's own releases (`installer-vX.Y.Z` and the fixed
          # `installer`) sit in the same list and are published, so "the
          # newest" would otherwise often be one of them: measured against
          # an installer's commit, every component would look unchanged since
          # a baseline that never carried one. `release-tags.sh` skips them,
          # which is why the whole page is read and not `--limit 1`.
          prev=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease --jq '.[] | [.tagName, .isPrerelease] | @tsv' | bash ./scripts/release-tags.sh base-for "$TAG")
          echo "previous published release: ${prev:-none}"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          # A different question gets a different baseline: the coupled-change
          # guard of the companions (see changed-components.sh, run_guard)
          # asks whether each rebuilt archive carries a number devices do not
          # already run, so it compares against the newest PUBLISHED release,
          # prereleases INCLUDED. Drafts excluded: a tag whose release was
          # refused or abandoned was never delivered. Asked of GitHub, not of
          # git, for the reason given above. Empty only when nothing was ever
          # published, which the guard reports.
          published=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | bash ./scripts/release-tags.sh newest-product)
          echo "newest published release, prereleases included: ${published:-none}"
          ./scripts/changed-components.sh --guard-baseline "$published" $prev > changed.txt
          cat changed.txt
          mkdir keep
          while read -r c; do
            mv assets/"$c"-*.tar.gz keep/
          done < changed.txt
          # Nobody's component, kept in every release.
          mv assets/ritornello-plugins-*.tar.gz keep/
          rm -rf assets
          mv keep assets
          ls -l assets
      - name: Refuse a unit/rule/updater change announced as "Nothing to do"
        # The one place in this workflow that *knows* a systemd unit, a
        # polkit rule or the updater changed — the updater cannot write any
        # of those itself, so the release notes are the only place a manual
        # step ever gets said. See scripts/release-notes-guard.sh for the
        # rule; kept out of this file so it can be run and read on a
        # development machine instead of discovered by pushing a tag.
        #
        # PREV through the environment, for the same reason as TAG in the
        # `release` job and in "Create the draft release" below: `${{ }}` is
        # substituted before the shell parses the line, so a tag name spliced
        # in that way becomes shell text, while "$PREV" is one word whatever
        # it contains.
        env:
          PREV: ${{ steps.changed.outputs.prev }}
        run: ./scripts/release-notes-guard.sh "$PREV"
      - name: One catalogue for the whole release
        # Built here and not in package-release.sh, for two measured reasons:
        # the filter above does `rm -rf assets` after keeping only the
        # archives it recognises, so a file dropped there by the packaging
        # script would be deleted; and the three architecture legs merge
        # their artefacts, so one arch-independent file produced three times
        # would collide. It is arch-independent, so it is built once.
        #
        # `components` describes **every** component, not the ones this
        # release ships: the device resolves each component to the newest
        # release carrying its archive, so a component untouched for seven
        # deliveries is described by a catalogue it never met otherwise.
        # `contracts` is the opposite: only what this release ships
        # (changed.txt, produced above), so that an archive carried by an
        # older release is never described with this tree's numbers.
        run: python3 scripts/plugin-catalogue.py --shipped changed.txt > assets/catalogue.json
      - name: One install inventory for the whole release
        # What each component places on the device, for ritornello-install.
        # Built here beside the catalogue, for the same two reasons, and like
        # it describing every component rather than the ones this release
        # ships. Generated by the same code the archives are staged from;
        # its self-test runs in the Rust suite (packaging_manifest.rs).
        run: python3 scripts/install-inventory.py > assets/inventory.json
      - name: One checksum file for every asset
        # This step runs after the filtering above, not before: SHA256SUMS
        # must describe only what this release carries. The core reads a
        # component's checksum from the release that carries its archive, and
        # a checksum file listing archives absent from this release would
        # describe archives that live elsewhere.
        #
        # No installer archive is attached to a product release any more (they
        # have a release of their own, see `publish-installer`), which is also
        # why no `*.zip` is listed: the Windows installer was the only one.
        run: cd assets && sha256sum *.tar.gz catalogue.json inventory.json > SHA256SUMS && ls -l
      - name: Create the draft release
        # A draft, not a publication: the notes must be read before anyone
        # installs from them — that is where "Nothing to do" or "Action
        # required" is decided. `gh` ships on the runner, so no third-party
        # action is involved in the one step that holds write permission.
        #
        # `TAG` through the environment, for the same reason as in `release`:
        # a ref name spliced into the script by `${{ }}` becomes shell text.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag carrying a semver prerelease suffix — `v0.2.1-beta.1` — is
          # published as a prerelease. **The shape of the tag decides**, so
          # there is no checkbox to forget and no second place where a human
          # states the same intent; and a device only ever offers one to an
          # owner who asked for prereleases (`update_prereleases`).
          #
          # Still a draft: a prerelease is read before it is published like
          # any other. Unquoted `$pre` on purpose — its value is either empty
          # or that one literal flag, never anything the tag can influence.
          pre=
          case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" \
            --draft $pre \
            --title "$TAG" \
            --notes-file .github/release-notes-template.md \
            assets/*

  publish-installer:
    name: Publish the installer
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Refuse a tag that does not match the installer's own number
        # Its own number, in `crates/ritornello-install/Cargo.toml`: neither
        # the product's nor a component's. The rule lives in release-tags.sh,
        # which has a self-test, because a workflow change cannot be tried
        # from its own branch. The tag travels through the environment, as in
        # `release`.
        env:
          TAG: ${{ github.ref_name }}
        run: bash ./scripts/release-tags.sh check-installer-tag "$TAG" crates/ritornello-install/Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: assets
      - name: One checksum file for these archives
        # Its own SHA256SUMS, listing only what this release carries. The
        # installer's `parse_sums` and the core's `parse_checksums` both key
        # by name, and neither ever reads this file for a component.
        run: cd assets && sha256sum *.tar.gz *.zip > SHA256SUMS && ls -l
      - name: Publish the numbered release
        # Published at once, not drafted: no device installs from it, so there
        # is no moment at which a person must read notes before anything can.
        # `--latest=false` and no `--prerelease`: GitHub's "latest" must keep
        # meaning the newest final PRODUCT release, which the update card and
        # the product's own links rely on.
        #
        # Never edited afterwards. The fixed release below is the only one that
        # is.
        #
        # **Re-runnable.** If the step after this one fails, "Re-run failed
        # jobs" restarts this whole job: a release that already exists is left
        # as it is (its assets were attached by the same run of the same tag),
        # so a re-run never fails on "already exists" and no tag is ever
        # pushed twice.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#installer-v}
          sed -e "s/@VERSION@/$version/g" .github/installer-release-notes.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --latest=false \
            --verify-tag \
            --title "ritornello-install $version" \
            --notes-file notes.md \
            assets/*
      - name: Move the fixed release `installer` onto this version
        # The README links `releases/download/installer/<file>`, one permanent
        # address per system with no version in it. This release is that
        # address: its tag is moved to this commit and its assets are replaced
        # by this version's. It is the ONE published release this repository
        # ever rewrites -- see AGENTS.md. No device fetches the installer, so
        # nothing compares versions of what it carries.
        #
        # **Re-runnable over a half-updated release**: every command below
        # converges (the tag move is forced, the edit sets absolute values,
        # the upload clobbers, stale assets are deleted by name), and a release
        # that a previous attempt created is found by `gh release view`.
        #
        # **An inherent window, not a bug to fix.** GitHub requires unique
        # asset names, so `--clobber` deletes each asset and uploads it again:
        # for a few seconds per publish a README link can answer 404. Nobody
        # downloads an installer at that rate, and the alternative (a new
        # release per publish) is exactly the version-bearing address the
        # README must not hold.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version=${TAG#installer-v}
          title="ritornello-install — latest ($version)"
          notes="The newest installer, always at this address: version $version. Every numbered installer is a release of its own, tagged installer-vX.Y.Z; the notes of $TAG say what changed."
          if gh release view installer >/dev/null 2>&1; then
            # Tag first, assets after: a reader who lands in between sees the
            # old archives under the old tag, never new bytes under an old one.
            gh api -X PATCH "repos/$REPO/git/refs/tags/installer" -f sha="$GITHUB_SHA" -F force=true
            gh release edit installer --latest=false --prerelease=false --title "$title" --notes "$notes"
            gh release upload installer assets/* --clobber
            # An asset that this version no longer carries must not outlive it.
            for old in $(gh release view installer --json assets --jq '.assets[].name'); do
              [ -e "assets/$old" ] || gh release delete-asset installer "$old" --yes
            done
          else
            gh release create installer \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "$title" \
              --notes "$notes" \
              assets/*
          fi
