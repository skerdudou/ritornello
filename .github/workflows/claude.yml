name: Claude Code

# Say `@claude` and Claude does what the comment asks.
#
# `/review` and `@claude-review` belong to `claude-code-review.yml`, and the
# exclusion below is load-bearing rather than tidy: **`@claude-review`
# contains `@claude`**, so without it every request for a code review would
# start a second session here, in parallel, doing something nobody asked for
# and paying for it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # `user.type != 'Bot'` on the two comment events is the counterpart of
    # the unbridled permission mode below: an automated comment quoting a
    # diff that happens to contain `@claude` would otherwise start a session
    # that can run anything. Nothing in this repository writes such a comment
    # today -- checked across every workflow and script -- and that is a
    # property worth keeping true by construction rather than by inspection.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude-review') && !startsWith(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude-review') && !startsWith(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # **Unbridled, because the default was measurably in the way.** On
          # PR #26 Claude reported it for itself: "Je n'ai pas pu lancer
          # `npm ci`/`npm test` moi-meme -- permissions Bash limitees a
          # `git`", and fell back to reading the CI logs. Asking a question
          # whose answer needs a command run is the normal use of this
          # workflow, so the default made it answer from the outside.
          #
          # What bounds it: the action resolves the commenter and refuses
          # anyone without write access, and `contents` stays `read` below --
          # nothing here can write a ref. Giving it `contents: write` so it
          # can commit is a separate decision, not an oversight.
          claude_args: '--permission-mode bypassPermissions'

