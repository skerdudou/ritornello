[workspace]
resolver = "2"
members = [
    "crates/ritornello-proto",
    "crates/ritornello-i18n",
    "crates/ritornello-plugin-sdk",
    "crates/ritornello-core",
    "crates/ritornello-updater",
    "crates/ritornello-plugin-radio",
    "crates/ritornello-plugin-cd",
    "crates/ritornello-plugin-musicbrainz",
    "crates/ritornello-plugin-nrj-metas",
    "crates/ritornello-plugin-ouifm-metas",
    "crates/ritornello-plugin-radiofrance-metas",
    "crates/ritornello-plugin-files",
    "crates/ritornello-plugin-console",
    "crates/ritornello-plugin-generic-input",
    "crates/ritornello-plugin-mpd",
]

[workspace.package]
# The PRODUCT number: it names the release and the git tag, and moves on every
# delivery. It carries the generation — 0.2.7 is the seventh delivery of the
# 0.2 generation — and is inherited only by the internal library crates, the
# ones no archive is named after.
#
# The shipped components (the core and the ten plugins) declare their OWN
# version instead, so a fix in one plugin does not renumber the product and
# does not make the device replace eleven components for one line. Major and
# minor stay identical to this number everywhere; only the third digit is
# free, component by component. `version_coherence.rs` asserts it.
#
# It is NOT the compatibility contract between a core and a plugin: that one
# is ritornello_proto::PROTOCOL_VERSION, which moves only on a wire break.
version = "0.2.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skerdudou/ritornello"
