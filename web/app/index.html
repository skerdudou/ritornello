    <title>Ritornello</title>
    <!--
      Tab icon: the `R` of the logo, the wordmark's initial standing on its
      own — the same mark, cut from the same drawing as the banner in the
      README.

      Inlined as a data URI rather than served as a file, and that is the
      point: a declared icon is the only thing that stops a browser asking
      for `/favicon.ico` on its own, and inlining it means the icon costs no
      request at all. It travels with the document, which is served
      `no-cache` anyway.

      **32 px and no larger.** That is exactly the tab strip's 16 px slot on
      a 2x screen, the only size this icon is ever drawn at; a larger source
      would only hand the browser a downsampling job we can do better here,
      and would pay for it in the shell on every single load.

      The bytes come from `docs/brand/mark.png`, and not by a plain
      downscale. The whole recipe, so it can be reproduced rather than
      guessed at: crop on `alpha >= 110`, which is the solid glyph and not
      the wide glow around it; 4% margin; hue held at 0.723 — the drawing's
      own violet, the median hue of its saturated pixels; saturation
      `min(1, 0.34 + 1.20 s)`; value clamped to `[0.48, 0.94]`; Lanczos to
      32 px.

      **Crop on the glyph, not on the glow.** That halo is a third of the
      drawing's height and reads as nothing at all once shrunk: cropped on
      it, the R filled 78% of the box and looked small inside its own icon.

      **The colour curve, because the drawing is built for a wide banner.**
      Its median pixel sits at value 0.97 with saturation 0.44 — a lilac
      washed toward white, 2.3:1 against a white tab strip, which is to say
      invisible. Holding the hue while pushing saturation and capping the
      value gives 7.1:1 on white and 6.4:1 on Chrome's grey strip. The hue
      is *held*, not merely boosted: raising the saturation of those pale
      highlights on their own hue turned them pink.

      What this costs is the dark tab strip, where the untouched mark was
      strongest — 2.3:1 on the median pixel. The shape survives there on the
      light top of the R, still at 4.5:1. No tile behind the glyph either
      way; both were looked at at 16 px over white, over Chrome's grey and
      over a dark strip before this was settled.
    -->
