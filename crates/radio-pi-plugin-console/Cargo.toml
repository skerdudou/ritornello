[package]
name = "radio-pi-plugin-console"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radio-pi-plugin-console"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
radio-pi-proto = { path = "../radio-pi-proto" }
radio-pi-plugin-sdk = { path = "../radio-pi-plugin-sdk" }
