[package]
name = "ritornello-plugin-console"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[[bin]]
name = "ritornello-plugin-console"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Pour `localtime_r` : l'heure locale de la veille. Deja l'idiome du depot
# pour ce que la bibliotheque C sait faire seule (voir core/system.rs).
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
