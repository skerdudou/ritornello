[package]
name = "radio-pi-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radio-pi-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
async-trait = "0.1"
radio-pi-proto = { path = "../radio-pi-proto" }
radio-pi-plugin-sdk = { path = "../radio-pi-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
