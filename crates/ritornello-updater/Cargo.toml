[package]
name = "ritornello-updater"
# Its own number, the sixth: it moves only when this crate changes, and never
# with the product. The core compares it for equality with the one
# ritornello-install recorded placing; see scripts/changed-components.sh.
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ritornello-update"
path = "src/bin/ritornello-update.rs"

[dependencies]
# Deliberately three dependencies and no more. This crate's binary runs as
# root: every crate linked into it is code that root executes. There is no
# archive reader here and no TLS stack — the core extracts and downloads
# unprivileged, and hands this binary a plain file to place.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
