[package]
name = "ritornello-plugin-musicbrainz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "ritornello-plugin-musicbrainz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `derive`: the store of learned patterns is serialized to JSON on disk. Same
# declaration as the other plugins, so as not to duplicate a branch in
# Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
# No `json` feature: the response is read as text and parsed by hand
# (`parse_lookup`), to extract only the first medium whose track count
# matches the inserted disc.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }

[dev-dependencies]
# Simulated clock, as in `ritornello-core` and the mpd plugin. Necessary, not
# a convenience: the throttling of requests to MusicBrainz is exercised over a
# 1.1 s interval, and really waiting for it would turn a correct test into a
# slow one — then into a flake as soon as the suite runs under load.
#
# Not to be assumed granted by `features = ["full"]` on the `[dependencies]`
# side: `full` does **not** include `test-util`, and without it
# `#[tokio::test(start_paused = true)]` fails at compile time, not at test time.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
