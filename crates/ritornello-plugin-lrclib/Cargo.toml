[package]
name = "ritornello-plugin-lrclib"
# Its own version, not the product's: this component can be fixed and
# published alone. Only the major follows the product;
# version_coherence.rs asserts it.
version = "0.2.0-beta.8"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ritornello-plugin-lrclib"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `derive`: cache entries are JSON files on disk. Same declaration as the
# other plugins, so as not to duplicate a branch in Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# No `json` feature: the body is read as text and parsed by `parse_record` /
# `parse_search`, so a malformed answer is told apart from a transport error.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Cache file names: a stable hash of the key. `DefaultHasher` is not stable
# across toolchains, and a renamed entry would be orphaned on disk. Same
# version as the core's, so Cargo.lock gains no second copy.
sha2 = "0.11"
ritornello-proto = { path = "../ritornello-proto" }

[dev-dependencies]
tempfile = "3"
