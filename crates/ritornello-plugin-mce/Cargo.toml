[package]
name = "ritornello-plugin-mce"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ritornello-plugin-mce"
path = "src/main.rs"

[dependencies]
anyhow = "1"
evdev = { version = "0.12", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
