[package]
name = "ritornello-install"
# Its own number, the fifth: neither the product's nor a component's. The
# installer rarely changes and no device ever fetches it, so it has a
# publication channel of its own (a tag `installer-vX.Y.Z`, see
# docs/installation.md) and this number moves only when the installer itself
# does. A finished X.Y.Z always: its releases are never prereleases.
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Installs, updates and removes Ritornello on a device over ssh, from a workstation."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The survey's nonce (R28). Already in the tree through ring, under reqwest.
getrandom = "0.4"
# `json`: the installer parses inventory.json straight off the wire. No
# OpenSSL: `rustls-tls` only, same as the core and the plugins that talk TLS.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ritornello-i18n = { path = "../ritornello-i18n" }
ritornello-manifest = { path = "../ritornello-manifest" }
ritornello-updater = { path = "../ritornello-updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
