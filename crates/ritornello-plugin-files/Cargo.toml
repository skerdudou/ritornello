[package]
name = "ritornello-plugin-files"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

# Une cible `lib` est indispensable ici : deux `[[bin]]` d'un même crate ne
# partagent pas leurs modules. Sans elle, le binaire racine de montage ne
# pourrait pas employer `roots.rs`, et l'argument qui justifie de les loger
# ensemble — le côté privilégié et le côté qui écrit la configuration lisent
# exactement la même grammaire — tomberait.
[lib]
name = "ritornello_plugin_files"
path = "src/lib.rs"

[[bin]]
name = "ritornello-plugin-files"
path = "src/main.rs"

[[bin]]
name = "ritornello-media-mount"
path = "src/bin/media-mount.rs"

[dependencies]
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `time` est déclaré parce que ce crate emploie `tokio::time` (délais de `smb`
# et de `sante`). Il compilait déjà sans, la caractéristique venant du SDK par
# unification : une dépendance qu'on ne demande pas est une dépendance qu'un
# jour on perd.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Lecture de la durée par l'en-tête, dans le processus.
#
# `default-features = false` a été essayé et **ne compile pas** : les types
# d'erreur ID3v2 vivent derrière une caractéristique par défaut. Ne pas
# retenter sans vérifier.
lofty = "0.25.1"

[dev-dependencies]
tempfile = "3"
