[package]
name = "ritornello-plugin-files"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

# A `lib` target is indispensable here: two `[[bin]]` of the same crate do not
# share their modules. Without it, the root mount binary could not use
# `roots.rs`, and the argument that justifies housing them together — the
# privileged side and the side that writes the configuration read exactly the
# same grammar — would fall apart.
[lib]
name = "ritornello_plugin_files"
path = "src/lib.rs"

[[bin]]
name = "ritornello-plugin-files"
path = "src/main.rs"

[[bin]]
name = "ritornello-media-mount"
path = "src/bin/media-mount.rs"

[dependencies]
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `time` is declared because this crate uses `tokio::time` (timeouts in `smb`
# and `health`). It already compiled without it, the feature coming from the SDK
# through unification: a dependency one does not ask for is a dependency one
# loses some day.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Reading the duration from the header, in-process.
#
# `default-features = false` was tried and **does not compile**: the ID3v2 error
# types live behind a default feature. Do not retry without checking.
lofty = "0.25.1"

[dev-dependencies]
tempfile = "3"
