# --- Declared sources ---
sources_title = "Sources"
no_sources = "No source declared yet. Add a folder or a network share to get started."
btn_add_device = "Add a folder from this device"
btn_add_to_playlist = "Add to playlist"
btn_remove_source = "Remove this source"
btn_retry_mount = "Retry mount"
mount_error_title = "The last mount attempt failed:"
# `{detail}` is `systemctl`'s own raw output, never translated (see
# `mount::reconcile`'s doc: a polkit refusal is explicit there, and a
# home-made sentence would make it opaque) — the same shape `share_not_declared`
# already carries.
mount_retry_failed = "the mount attempt failed: {detail}"
share_not_declared = "the share was not mounted, so it has not been declared: {detail}"
# Whole-sentence key, not `share_not_declared` nested inside itself: the
# fallback used to be a *resolved* sentence handed to `share_not_declared` as
# its own `{detail}`, which is exactly the two-levels-of-resolution shape
# this chantier moved away from (language-packs chantier, task 9). Composed
# once, in each language, instead.
share_not_declared_silent = "the share was not mounted, so it has not been declared: systemd reported success but the mount point is missing: check the share name, the credentials, and that cifs-utils is installed; see journalctl -u ritornello-media-mount for the exact cause"

