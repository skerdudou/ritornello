# English catalog of the `files` plugin, embedded in the binary.
#
# Any key added here must also be added to every language pack under
# deploy/locales/files/ (a parity test refuses one that lacks it), and a new
# refusal must enter its module's
# `every_refusal_names_a_key_that_exists_in_the_embedded_catalog` test:
# without it, a typo would put the raw key on screen.

# Statuses shown by the Source.
status_files = "FILES"
no_playlist = "NO PLAYLIST"
empty_track = "NO SUCH TRACK"

# Root validation refusals.
bad_root_name = "invalid root name \"{name}\": use lowercase letters, digits and dashes only, starting with a letter or digit"
bad_host = "invalid server address \"{host}\": no commas, spaces or \"..\""
bad_share = "invalid share name \"{share}\": no commas, spaces or \"..\""
bad_subpath = "invalid subfolder \"{path}\": it must be relative and must not go up"
duplicate_root = "a root named \"{name}\" already exists"
relative_local_path = "the local folder \"{path}\" must be an absolute path"

# Recursive scan refusals.
too_many_tracks = "this folder holds more than {cap} tracks: narrow it down, or add its subfolders one by one"
scan_io_error = "could not read \"{path}\": check that it still exists, and that Ritornello is allowed to read it"

# Saved-playlist store refusals.
bad_playlist_name = "invalid playlist name \"{name}\": no slashes, and it must not start with a dot"
read_only_root = "the root \"{name}\" is mounted read-only: allow writing on it to save playlists there"
unknown_root = "no root named \"{name}\""
store_io_error = "could not write or read \"{path}\""

# Admin half refusals.
bad_request = "the page sent something this plugin did not understand ({detail})"
# A background task (scan, browse, search) was interrupted before reporting
# anything — a `tokio::task::JoinHandle` error, never seen in practice
# outside a panic or a shutdown. Not translated from any specific cause,
# unlike every refusal above: `{detail}` carries whatever the runtime says.
internal_task_error = "an internal task was interrupted: {detail}"

