[package]
name = "ritornello-plugin-cd"
# Its own patch version, not the product's: this component can be fixed and
# published alone. Major and minor must stay on the product generation —
# version_coherence.rs asserts it.
version = "0.2.0-beta.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

# What the release catalogue publishes about this plugin, so the installables
# dialog can describe it before anything of it has ever run: the kinds it
# serves, and one line an owner reads to choose. English here because this is
# the only declaration guaranteed to exist — four plugins ship no locale pack
# at all. A French translation is an addition in the plugin's own pack.
[package.metadata.ritornello]
kinds = ["source"]
description = "Plays audio CDs: disc presence, playback, current track, and eject."

[[bin]]
name = "ritornello-plugin-cd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
rand = "0.10"
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }

[dev-dependencies]
tempfile = "3"
