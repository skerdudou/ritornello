[package]
name = "ritornello-plugin-mpd"
# Its own patch version, not the product's: this component can be fixed and
# published alone. Major and minor must stay on the product generation —
# version_coherence.rs asserts it.
version = "0.2.0-beta.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

# What the release catalogue publishes about this plugin, so the installables
# dialog can describe it before anything of it has ever run: the kinds it
# serves, and one line an owner reads to choose. English here because this is
# the only declaration guaranteed to exist — four plugins ship no locale pack
# at all. A French translation is an addition in the plugin's own pack.
[package.metadata.ritornello]
kinds = ["display", "input"]
description = "Controls and displays playback through the MPD protocol, for any MPD client."

[[bin]]
name = "ritornello-plugin-mpd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Features listed explicitly, not `full`: `net` for the `TcpListener`,
# `io-util` for lines (Task 8), `sync` for the `RwLock` and the `Notify`
# (Task 5), `time` for the timeouts. See `files`'s `Cargo.toml` — "a
# dependency you don't request is a dependency you lose one day" — and
# that goes for features too.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }

[dev-dependencies]
tempfile = "3"
# Simulated clock: the test that verifies `MpdInput::next_command` stays
# pending as long as a sender of the channel is alive must not guess how
# long "long enough" represents on the machine running it (see
# `ritornello-core/Cargo.toml` for the same need). Without it, a real
# timeout would have to be picked at random and would remain a potential
# flake.
tokio = { version = "1", features = ["test-util"] }
