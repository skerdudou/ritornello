[package]
name = "ritornello-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ritornello-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# `toml` can read, but cannot rewrite without flattening everything:
# `plugins.toml` is made of comments (what each plugin is for), and `deploy.sh`
# adds commented blocks to it. `toml_edit` preserves formatting and comments.
toml_edit = "0.25"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
async-trait = "0.1"
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }
rust-embed = { version = "8", features = ["debug-embed"] }
# statvfs, for the root filesystem usage shown on the System tab. Already
# in Cargo.lock (tokio depends on it), so this adds no compilation.
libc = "0.2"
# The core fetches the covers itself: the browser never contacts the outside.
# `rustls` like the plugins, no OpenSSL on the Pi.
# `chunk()` (the cap applied while streaming) does not depend on the `stream`
# feature: that one only gates `bytes_stream()`, which we do not use.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Serves the local cover as a stream rather than as a single `Vec`: already in
# the graph (reqwest depends on it), so no new compiled dependency.
tokio-util = { version = "0.7", features = ["io"] }
# Same version as the `files` plugin, so as not to duplicate a branch in
# Cargo.lock. Used to extract the cover embedded in the file being played.
lofty = "0.25.1"
# Re-encoding of covers before pushing them onto a socket: a 20 MiB
# `folder.jpg` becomes a thumbnail of a few tens of kilobytes, which divides
# the memory peak of a publication by as much (see `cover::Rendition`).
#
# `default-features = false` and only three formats, chosen from what one
# really encounters in an album cover. This crate's default enables a dozen
# decoders (TIFF, TGA, DDS, EXR, farbfeld…) none of which shows up on a music
# NAS, and each is code that compiles and parses input coming from the network
# — attack surface as much as compile time.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tempfile = "3"
# Simulated clock: without it, the race between a ready announcement and the
# rendezvous deadline does not reproduce in a test (see
# `register::tests::a_ready_announcement_at_the_deadline_is_never_lost`), and
# the test would pass just as well with the defect it is supposed to forbid.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
