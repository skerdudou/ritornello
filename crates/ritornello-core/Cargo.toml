[package]
name = "ritornello-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ritornello-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `toml` sait lire, pas réécrire sans tout aplatir : `plugins.toml` est fait
# de commentaires (à quoi sert chaque greffon), et `deploy.sh` y ajoute des
# blocs commentés. `toml_edit` préserve mise en forme et commentaires.
toml_edit = "0.22"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
async-trait = "0.1"
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-i18n = { path = "../ritornello-i18n" }
rust-embed = { version = "8", features = ["debug-embed"] }
# statvfs, for the root filesystem usage shown on the System tab. Already
# in Cargo.lock (tokio depends on it), so this adds no compilation.
libc = "0.2"
# Le cœur va chercher les pochettes lui-même : le navigateur ne contacte
# jamais l'extérieur. `rustls` comme les greffons, pas d'OpenSSL sur le Pi.
# `chunk()` (le plafond appliqué en streaming) ne dépend pas de la fonctionnalité
# `stream` : elle ne gate que `bytes_stream()`, qu'on n'utilise pas.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Sert la pochette locale en flux plutôt qu'en un seul `Vec` : déjà dans le
# graphe (reqwest en dépend), donc aucune nouvelle dépendance compilée.
tokio-util = { version = "0.7", features = ["io"] }
# Même version que le greffon `files`, pour ne pas dupliquer une branche dans
# Cargo.lock. Sert à extraire la pochette embarquée dans le fichier joué.
lofty = "0.25.1"
# Réencodage des pochettes avant de les pousser sur un socket : un `folder.jpg`
# de 20 Mio devient une vignette de quelques dizaines de kilooctets, ce qui
# divise d'autant le pic mémoire d'une publication (voir `cover::rendu`).
#
# `default-features = false` et trois formats seulement, choisis sur ce qu'on
# rencontre vraiment dans une pochette d'album. Le défaut de cette crate active
# une douzaine de décodeurs (TIFF, TGA, DDS, EXR, farbfeld…) dont aucun
# n'apparaît sur un NAS de musique, et chacun est du code qui compile et qui
# analyse une entrée venue du réseau — la surface d'attaque autant que le temps
# de compilation.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tempfile = "3"
# Horloge simulee : sans elle, la course entre une annonce prete et l'echeance
# du rendez-vous ne se reproduit pas dans un test (voir
# `register::tests::une_annonce_prete_a_lecheance_nest_jamais_perdue`), et le
# test passerait aussi bien avec le defaut qu'il est cense interdire.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
