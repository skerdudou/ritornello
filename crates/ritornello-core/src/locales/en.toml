system_voltage_help_body = "The Raspberry Pi flags it when its power supply drops below the safe threshold. The firmware reacts by capping the CPU frequency, so playback can stutter or the device can reboot. This flag stays set until the next reboot, even once the supply is back to normal — so it can still show up here after the fact, while everything already looks fine. The cause is almost always the power adapter or the cable, rarely the Pi itself."
