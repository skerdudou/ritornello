# Album covers. One card: the memory the cache may occupy (a budget, not a
# count), then the ceilings on what the core agrees to read, then the
# re-encoding switch and the four settings describing the thumbnail. The
# source ceiling stays live whatever the switch says: it is the only guard
# left when re-encoding is off.
cover_card_title = "Album covers"
cover_cache_budget_label = "Memory budget (MiB)"
cover_cache_budget_help = "Bounds the bytes of covers downloaded from the internet and the thumbnails kept ready to serve. A local cover — a file beside the track, or one embedded in it — costs only a path, never these bytes."
cover_cache_estimate = "With {budget} MiB of budget, a download ceiling of {download} MiB and entries of at most {entry} KiB: at least {floor} covers held at once in the worst case (every cover from the internet), about {typical} for a library of local covers."
cover_cache_estimate_unlimited = "At least {floor} covers held at once in the worst case; re-encoding is off, so a local cover costs only a path, and the cache still keeps a few hundred of them at most."
cover_predicted_weight = "At these settings a thumbnail weighs about {kio} KiB."
cover_download_max_label = "Automatic download ceiling (MiB)"
cover_download_max_help = "Largest cover the device downloads on its own from the internet when a track is announced. Separate from the source ceiling below, which also bounds a full-size cover a user asks for by hand, such as by enlarging one."
cover_source_max_label = "Source ceiling (MiB)"
cover_source_max_help = "Largest cover the device will read. Always applied, re-encoding or not; capped at the 20 MiB the plugin protocol guarantees."
cover_rendition_label = "Re-encode covers before pushing them"
cover_rendition_help = "Off, the original image is pushed as it is: for a 20 MiB cover the memory peak of one publication goes from about 1.8 MiB to about 72 MiB. The four settings below only describe the thumbnail."
cover_max_edge_label = "Thumbnail longest edge (px)"
cover_jpeg_quality_label = "JPEG quality"
cover_jpeg_quality_help = "JPEG only: a cover with an alpha channel is re-encoded to PNG, lossless."
cover_passthrough_max_label = "Leave alone below (KiB)"
cover_passthrough_max_help = "A cover already lighter than this, and no wider than the edge below, is pushed exactly as it is: re-encoding it would not lighten it. It is also how a thumbnail supplied by a plugin is accepted without being touched."
cover_max_pixels_label = "Decode ceiling (Mpx)"
cover_max_pixels_help = "Read from the header before any allocation: w x h x 4 bytes of buffer, so 16 Mpx is 64 MiB. A 200 KiB PNG can claim 30000 x 30000 pixels."
# Behind the "(?)" set on the card's own title — no longer beside the estimate,
# where it read as a footnote on that one sentence: what it opens is the state
# of the cache the whole card configures.
# The title says "memory" rather than "what the cache holds": the panel counts
# bytes only, and a local cover, which costs a path, appears nowhere in it.
cover_cache_open = "See the memory the covers occupy"
cover_cache_title = "Memory the covers occupy"
cover_cache_hint = "Read at the moment this opened."
# Two lines, and everything held is on one of them: the two weights add up to
# what is occupied. The panel used to list *mechanisms* instead — renditions
# produced, thumbnails supplied, full sizes downloaded — and on a device
# playing radio all three read zero while the memory climbed, because a cover
# announced as a single URL is none of the three.
cover_cache_thumbnails = "Thumbnails"
cover_cache_full_sizes = "Full-size images"
# Encoder runs since boot, and not thumbnails held: this says whether the
# appliance is spending CPU re-encoding, which nothing the cache *holds* can.
cover_cache_renditions = "Re-encodings"
cover_cache_used = "Occupied"
# The unit travels with its number, never glued to a label: a language places
# both where it wants, and some do not put the unit last.
cover_cache_kio = "{n} KiB"
cover_cache_mio = "{n} MiB"
cover_cache_used_value = "{used} of {budget}"
# "In memory", not "empty": a library of local covers holds hundreds of
# entries that cost a path and no bytes, and calling that empty would be false.
cover_cache_empty = "No cover is held in memory."
cover_cache_failed = "Snapshot unavailable."
