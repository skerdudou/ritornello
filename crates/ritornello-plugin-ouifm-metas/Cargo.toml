[package]
name = "ritornello-plugin-ouifm-metas"
# Its own patch version, not the product's: this component can be fixed and
# published alone. Major and minor must stay on the product generation —
# version_coherence.rs asserts it.
version = "0.2.0-beta.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ritornello-plugin-ouifm-metas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
ritornello-proto = { path = "../ritornello-proto" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
