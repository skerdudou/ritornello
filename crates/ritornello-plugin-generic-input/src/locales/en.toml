# « Presets » plutot qu'un simple « +10 » : cette touche decale le chiffre
# suivant de dix (+10 puis 4 selectionne la station 14), elle ne deplace pas
# la lecture. Sans ce mot, elle se lit comme « +10 secondes » des que les
# actions de deplacement partagent la meme liste — ce qui est exactement ce
# qui s'est produit.
