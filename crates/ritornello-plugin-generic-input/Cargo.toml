[package]
name = "ritornello-plugin-generic-input"
# Its own version, not the product's: this component can be fixed and
# published alone. Only the major follows the product;
# version_coherence.rs asserts it.
version = "0.2.0-beta.4"
edition.workspace = true
license.workspace = true
repository.workspace = true

# What the release catalogue publishes about this plugin, so the installables
# dialog can describe it before anything of it has ever run: the kinds it
# serves, and one line an owner reads to choose. English here because this is
# the only declaration guaranteed to exist — four plugins ship no locale pack
# at all. A French translation is an addition in the plugin's own pack.
[package.metadata.ritornello]
kinds = ["input"]
description = "Physical buttons and remotes, with learnable bindings and presets."
admin = true

[[bin]]
name = "ritornello-plugin-generic-input"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
evdev = { version = "0.13", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ritornello-i18n = { path = "../ritornello-i18n" }
ritornello-plugin-sdk = { path = "../ritornello-plugin-sdk" }
ritornello-proto = { path = "../ritornello-proto" }

[dev-dependencies]
tempfile = "3"
# Simulated clock: the periodic rescan is proven without waiting five real
# seconds, nor guessing how long a scan takes.
tokio = { version = "1", features = ["test-util"] }
