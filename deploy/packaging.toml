# What each release archive carries, beyond what can be derived.
#
# Derived elsewhere, and deliberately absent from this file:
#   - the set of plugins comes from plugins.example.toml (same source as
#     deploy.sh, so the two cannot diverge).
#
# No component archive carries translated text any more. Every language,
# French included, ships as its own archive built from deploy/locales/ by
# package-release.sh's `--languages` path (see deploy/language-packs.toml)
# and installed by the unprivileged core. A component that shipped its own
# fr.toml AND a language pack that ships the same file would fight over one
# path on disk, and reinstalling that component would move a translation
# backwards — packaging_manifest.rs refuses the shape outright.
#
# `tree` entries land in the archive under the path they will have on the
# device, so installing is one `tar -C /`. `examples` entries land beside the
# tree and are copied by hand: they must never overwrite what the operator
# wrote.

[core]
# The updater's privileged binary. Installed OUTSIDE the plugins directory,
# for the same reason as the files plugin's mount helper: the core launches
# what plugins.toml declares, and this one is launched by systemd, as root.
#
# It is also, deliberately, NOT something an update can replace: `target.rs`
# cannot form this path. So the updater only ever changes by hand — which is
# what makes it trustworthy, and what puts a change to it in the release
# notes' "Action required".
extra_binaries = [
  { name = "ritornello-update", to = "usr/local/lib/ritornello/ritornello-update" },
]
tree = [
  { from = "deploy/ritornello.service", to = "etc/systemd/system/ritornello.service" },
  { from = "deploy/ritornello-update.service", to = "etc/systemd/system/ritornello-update.service" },
  { from = "deploy/ritornello-rollback.service", to = "etc/systemd/system/ritornello-rollback.service" },
  { from = "deploy/50-ritornello-power.rules", to = "etc/polkit-1/rules.d/50-ritornello-power.rules" },
  { from = "deploy/52-ritornello-update.rules", to = "etc/polkit-1/rules.d/52-ritornello-update.rules" },
]
# Units the installer enables after placing them. Declared here, beside the
# files they belong to, rather than known to the installer by name.
#
# Only this one, as deploy.sh does: ritornello-update.service is a oneshot the
# core starts on demand, and ritornello-rollback.service is reached only by
# OnFailure= on ritornello.service. Enabling either would give it a caller it
# must not have.
enable = ["ritornello.service"]

[plugins.radio]
examples = ["deploy/stations.example.toml"]
# Doubles as the initial configuration: installing the radio and getting an
# empty station list is a worse first experience than the defaults, and
# `deploy.sh` already provisions this file when it is absent. Declared here so
# there is one source of truth instead of two hard-coded names in a shell
# loop. A file named in BOTH lists is not duplicated in the archive: it lands
# in `initial-config/` and stays out of `examples/`.
initial_config = ["deploy/stations.example.toml"]

[plugins.cd]

[plugins.files]
# The second [[bin]] of the files crate. It is installed OUTSIDE the plugins
# directory on purpose: the core launches everything it finds there, and this
# one is launched by systemd, as root. A split by `ritornello-plugin-*` would
# drop it and ship a source that cannot mount anything.
extra_binaries = [
  { name = "ritornello-media-mount", to = "usr/local/lib/ritornello/ritornello-media-mount" },
]
tree = [
  { from = "deploy/ritornello-media-mount.service", to = "etc/systemd/system/ritornello-media-mount.service" },
  { from = "deploy/51-ritornello-media.rules", to = "etc/polkit-1/rules.d/51-ritornello-media.rules" },
]
examples = ["deploy/media-roots.example.toml"]
# Enabled, not started, as deploy.sh does: a oneshot that reconciles the
# declared shares at boot; the plugin starts it on demand the rest of the time.
enable = ["ritornello-media-mount.service"]
# Where this plugin mounts shares. Removing it unmounts everything under this
# root first, then removes the empty mount points — never recursively: a
# recursive delete of a mounted share would delete the NAS's content.
mount_root = "/mnt/ritornello"

[plugins.ouifm-metas]
examples = ["deploy/ouifm-metas.example.toml"]

[plugins.radiofrance-metas]
examples = ["deploy/radiofrance-metas.example.toml"]

# Declared here, between the other two station-specific tables and
# musicbrainz, to mirror plugins.example.toml — where that position is a
# requirement rather than a convention, since `metadata` plugins are
# arbitrated by declaration order.
[plugins.nrj-metas]
examples = ["deploy/nrj-metas.example.toml"]

[plugins.musicbrainz]

[plugins.generic-input]
tree = [
  { from = "deploy/input-presets", to = "etc/ritornello/input-presets" },
]
examples = ["deploy/input-bindings.example.toml"]
# The same reasoning as radio's station list: see there.
initial_config = ["deploy/input-bindings.example.toml"]

[plugins.console]

[plugins.mpd]
examples = ["deploy/mpd.example.toml"]
