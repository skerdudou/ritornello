# The version of each language pack. A pack is a shipped component, so it
# declares its own number -- and it has no Cargo.toml to declare it in.
#
# Only the major follows the product, like every component;
# version_coherence.rs asserts it, and changed-components.sh reads this file
# to decide what to publish.
[fr]
version = "0.2.0-beta.4"

[de]
version = "0.2.0-beta.4"

[es]
version = "0.2.0-beta.4"

[it]
version = "0.2.0-beta.4"
