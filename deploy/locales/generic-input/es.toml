# "Presets" rather than a bare "+10": this key shifts the next digit by ten
# (+10 then 4 selects station 14), it does not move playback. Without that
# word it reads as "+10 seconds" as soon as the seek actions share the same
# list — which is exactly what happened.
act_plus10 = "Presintonías +10"
act_volume_up = "Volumen +"
act_volume_down = "Volumen -"
act_mute = "Silencio"
act_play_pause = "Reproducir/pausa"
act_stop = "Detener"
# "in track" tells them apart from "Previous"/"Next", which change track.
# No number in the label: the step is adjustable from the configuration
# page, and "10 s" would become a lie.
act_seek_back = "Retroceder en la pista"
act_seek_forward = "Avanzar en la pista"
act_next = "Siguiente"
