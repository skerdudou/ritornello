# "Presets" rather than a bare "+10": this key shifts the next digit by ten
# (+10 then 4 selects station 14), it does not move playback. Without that
# word it reads as "+10 seconds" as soon as the seek actions share the same
# list — which is exactly
# what happened.
act_plus10 = "Preselezioni +10"
act_volume_up = "Volume +"
act_volume_down = "Volume -"
act_mute = "Muto"
act_play_pause = "Riproduci/pausa"
act_stop = "Stop"
# "in track" tells them apart from "Previous"/"Next", which change track.
# No number in the label: the step is adjustable from the configuration page,
# and "10 s" would become a lie.
act_seek_back = "Indietro nel brano"
act_seek_forward = "Avanti nel brano"
act_next = "Successivo"
act_prev = "Precedente"
act_eject = "Espelli"
act_source_cycle = "Cambia sorgente"
act_toggle_random = "Casuale"
act_toggle_repeat_all = "Ripeti tutto"
act_power = "Standby"

