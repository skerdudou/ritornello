# Pack français du plugin `files`.
#
# Le jeu de clés doit rester **identique** à celui du catalogue anglais embarqué
# (`crates/ritornello-plugin-files/src/locales/en.toml`) : un test de parité le
# vérifie, et une clé manquante ici afficherait l'anglais sans prévenir.

# Statuts affichés par la Source.
status_files = "FICHIERS"
no_playlist = "AUCUNE LISTE"
empty_track = "PISTE INEXISTANTE"

# Refus de validation des racines.
