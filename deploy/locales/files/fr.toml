# --- Silent mount points ---
#
# Deliberately distinct from `bad_local_path` and `missing_badge`: a share
# that no longer answers is neither an invalid path nor a deleted file, and
# saying either sends the search for the fault to the wrong place.
root_unresponsive = "« {path} » ne répond pas : le partage est peut-être endormi ou injoignable. Rien n'a été modifié."
unresponsive_title = "Ces points de montage ne répondent pas :"
unresponsive_hint = "Les informations qui les concernent restent incomplètes jusqu'à leur retour. La lecture des sources locales n'est pas affectée."
