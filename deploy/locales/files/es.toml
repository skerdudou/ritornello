# --- Unresponsive mount points ---
#
# Distinct from `bad_local_path` and from `missing_badge` on purpose: a share
# that stopped answering is neither an invalid path nor a deleted file, and
# saying either sends the user looking for the fault in the wrong place.
root_unresponsive = "«{path}» no responde: puede que el recurso compartido esté en reposo o inaccesible. No se ha cambiado nada."
unresponsive_title = "Estos puntos de montaje no responden:"
unresponsive_hint = "La información que se muestra sobre ellos estará incompleta hasta que vuelvan a responder. La reproducción de las fuentes locales no se ve afectada."
missing_unknown = "desconocido"
