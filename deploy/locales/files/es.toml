mount_error_title = "El último intento de montaje falló:"
# `{detail}` is `systemctl`'s own raw output, never translated (see
# `mount::reconcile`'s doc: a polkit refusal is explicit there, and a
# home-made sentence would make it opaque) — the same shape `share_not_declared`
# already carries.
mount_retry_failed = "el intento de montaje falló: {detail}"
share_not_declared = "el recurso compartido no se montó, así que no se ha declarado: {detail}"
# Whole-sentence key, not `share_not_declared` nested inside itself: the
# fallback used to be a *resolved* sentence handed to `share_not_declared` as
# its own `{detail}`, which is exactly the two-levels-of-resolution shape
# this chantier moved away from (language-packs chantier, task 9). Composed
# once, in each language, instead.
share_not_declared_silent = "el recurso compartido no se montó, así que no se ha declarado: systemd indicó éxito pero falta el punto de montaje: comprueba el nombre del recurso compartido, las credenciales y que cifs-utils esté instalado; consulta journalctl -u ritornello-media-mount para ver la causa exacta"

