scan_io_error = "no se pudo leer «{path}»: comprueba que todavía existe y que Ritornello tiene permiso para leerla"

# Saved playlist store refusals.
bad_playlist_name = "nombre de lista no válido «{name}»: sin barras, y no debe empezar por un punto"
