bad_host = "dirección de servidor no válida «{host}»: sin comas, espacios ni «..»"
bad_share = "nombre de recurso compartido no válido «{share}»: sin comas, espacios ni «..»"
bad_subpath = "subcarpeta no válida «{path}»: debe ser relativa y no debe subir de nivel"
duplicate_root = "ya existe una raíz llamada «{name}»"
relative_local_path = "la carpeta local «{path}» debe ser una ruta absoluta"

# Recursive scan refusals.
