mount_error_title = "L'ultimo tentativo di montaggio non è riuscito:"
# `{detail}` is `systemctl`'s own raw output, never translated (see
# `mount::reconcile`'s doc: a polkit refusal is explicit there, and a
# home-made sentence would make it opaque) — the same shape `share_not_declared`
# already carries.
mount_retry_failed = "il tentativo di montaggio non è riuscito: {detail}"
share_not_declared = "la condivisione non è stata montata, quindi non è stata dichiarata: {detail}"
# Whole-sentence key, not `share_not_declared` nested inside itself: the
# fallback used to be a *resolved* sentence handed to `share_not_declared` as
# its own `{detail}`, which is exactly the two-levels-of-resolution shape
# this chantier moved away from (language-packs chantier, task 9). Composed
# once, in each language, instead.
share_not_declared_silent = "la condivisione non è stata montata, quindi non è stata dichiarata: systemd ha segnalato un esito positivo ma il punto di montaggio manca: controlla il nome della condivisione, le credenziali e che cifs-utils sia installato; vedi journalctl -u ritornello-media-mount per la causa esatta"

