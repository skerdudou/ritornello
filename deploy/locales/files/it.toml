# Admin half refusals.
bad_request = "la pagina ha inviato qualcosa che questo plugin non ha capito ({detail})"
# A background task (scan, browse, search) was interrupted before reporting
# anything — a `tokio::task::JoinHandle` error, never seen in practice
# outside a panic or a shutdown. Not translated from any specific cause,
# unlike every refusal above: `{detail}` carries whatever the runtime says.
internal_task_error = "un'attività interna è stata interrotta: {detail}"

