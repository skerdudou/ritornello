# --- Unresponsive mount points ---
#
# Distinct from `bad_local_path` and from `missing_badge` on purpose: a share
# that stopped answering is neither an invalid path nor a deleted file, and
# saying either sends the user looking for the fault in the wrong place.
root_unresponsive = "«{path}» non risponde: la condivisione potrebbe essere in sospensione o irraggiungibile. Non è stato modificato nulla."
unresponsive_title = "Questi punti di montaggio non rispondono:"
unresponsive_hint = "Le informazioni mostrate su di essi restano incomplete finché non rispondono di nuovo. La riproduzione delle sorgenti locali non è interessata."
