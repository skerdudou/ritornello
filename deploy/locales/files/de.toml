mount_error_title = "Der letzte Einbindeversuch ist fehlgeschlagen:"
# `{detail}` is `systemctl`'s own raw output, never translated (see
# `mount::reconcile`'s doc: a polkit refusal is explicit there, and a
# home-made sentence would make it opaque) — the same shape `share_not_declared`
# already carries.
mount_retry_failed = "der Einbindeversuch ist fehlgeschlagen: {detail}"
share_not_declared = "die Freigabe wurde nicht eingebunden und daher nicht eingetragen: {detail}"
# Whole-sentence key, not `share_not_declared` nested inside itself: the
# fallback used to be a *resolved* sentence handed to `share_not_declared` as
# its own `{detail}`, which is exactly the two-levels-of-resolution shape
# this chantier moved away from (language-packs chantier, task 9). Composed
# once, in each language, instead.
share_not_declared_silent = "die Freigabe wurde nicht eingebunden und daher nicht eingetragen: systemd meldete Erfolg, aber der Einhängepunkt fehlt: Prüfen Sie den Freigabenamen, die Zugangsdaten und ob cifs-utils installiert ist; die genaue Ursache zeigt journalctl -u ritornello-media-mount"

