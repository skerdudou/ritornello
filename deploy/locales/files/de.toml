relative_local_path = "der lokale Ordner „{path}“ muss ein absoluter Pfad sein"

# Recursive scan refusals.
too_many_tracks = "dieser Ordner enthält mehr als {cap} Titel: Schränken Sie ihn ein oder fügen Sie seine Unterordner einzeln hinzu"
scan_io_error = "„{path}“ konnte nicht gelesen werden: Prüfen Sie, ob es noch existiert und ob Ritornello es lesen darf"

# Saved-playlist store refusals.
bad_playlist_name = "ungültiger Wiedergabelistenname „{name}“: keine Schrägstriche, und er darf nicht mit einem Punkt beginnen"
