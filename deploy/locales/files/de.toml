# --- Unresponsive mount points ---
#
# Distinct from `bad_local_path` and from `missing_badge` on purpose: a share
# that stopped answering is neither an invalid path nor a deleted file, and
# saying either sends the user looking for the fault in the wrong place.
root_unresponsive = "„{path}“ antwortet nicht: Die Freigabe schläft möglicherweise oder ist nicht erreichbar. Es wurde nichts geändert."
unresponsive_title = "Diese Einhängepunkte antworten nicht:"
unresponsive_hint = "Die angezeigten Informationen zu ihnen bleiben unvollständig, bis sie wieder antworten. Die Wiedergabe lokaler Quellen ist nicht betroffen."
missing_unknown = "unbekannt"
