# German pack of the `files` plugin.
#
# Its key set must stay **identical** to that of the embedded English catalog
# (`crates/ritornello-plugin-files/src/locales/en.toml`): a parity test checks
# it, and a key missing here would show English without warning.

# Statuses shown by the Source.
status_files = "DATEIEN"
no_playlist = "KEINE LISTE"
