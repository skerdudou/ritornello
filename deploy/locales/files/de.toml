# Root validation refusals.
bad_root_name = "ungültiger Wurzelname „{name}“: nur Kleinbuchstaben, Ziffern und Bindestriche, beginnend mit einem Buchstaben oder einer Ziffer"
bad_host = "ungültige Serveradresse „{host}“: keine Kommas, Leerzeichen oder „..“"
bad_share = "ungültiger Freigabename „{share}“: keine Kommas, Leerzeichen oder „..“"
