system_voltage_help_body = "Le Raspberry Pi le signale quand son alimentation descend sous le seuil sûr. Le microprogramme réagit en bridant la fréquence du processeur : la lecture peut alors hoqueter, ou l'appareil redémarrer. Ce signal reste actif jusqu'au prochain redémarrage, même une fois l'alimentation redevenue normale — il peut donc encore apparaître ici après coup, alors que tout semble déjà normal. La cause est presque toujours le bloc d'alimentation ou le câble, rarement le Pi lui-même."
