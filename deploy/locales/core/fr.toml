# Pochettes d'album. Une seule carte : la mémoire que le cache peut occuper
# (un budget, pas un compte), puis les plafonds de ce que le cœur accepte de
# lire, puis l'interrupteur de réencodage et les quatre réglages qui décrivent
# la vignette. Le plafond de la source reste actif quoi que dise
# l'interrupteur : c'est la seule garde qui subsiste quand le réencodage est
# décoché.
cover_card_title = "Pochettes d'album"
cover_cache_budget_label = "Budget mémoire (Mio)"
cover_cache_budget_help = "Borne les octets des pochettes téléchargées depuis internet et les vignettes gardées prêtes à servir. Une pochette locale — un fichier à côté du morceau, ou intégré à celui-ci — ne coûte qu'un chemin, jamais ces octets."
cover_cache_estimate = "Avec {budget} Mio de budget, un plafond de téléchargement de {download} Mio et des entrées d'au plus {entry} Kio : au moins {floor} pochettes en mémoire dans le pire cas (toutes venues d'internet), environ {typical} pour une bibliothèque de pochettes locales."
cover_cache_estimate_unlimited = "Au moins {floor} pochettes en mémoire dans le pire cas ; le réencodage est décoché, donc une pochette locale ne coûte qu'un chemin, et le cache en garde quand même quelques centaines au plus."
cover_predicted_weight = "À ces réglages, une vignette pèse environ {kio} Kio."
cover_download_max_label = "Plafond de téléchargement automatique (Mio)"
cover_download_max_help = "Plus grande pochette que l'appareil télécharge de lui-même depuis internet à l'annonce d'un morceau. Distinct du plafond de la source ci-dessous, qui borne aussi une pochette en plein format qu'un utilisateur demande à la main, en l'agrandissant par exemple."
cover_source_max_label = "Plafond de la source (Mio)"
cover_source_max_help = "Plus grande pochette que l'appareil accepte de lire. Toujours appliqué, réencodage ou non ; borné aux 20 Mio que le protocole des greffons garantit."
cover_rendition_label = "Réencoder les pochettes avant de les pousser"
cover_rendition_help = "Décoché, l'image d'origine part telle quelle : pour une pochette de 20 Mio, le pic mémoire d'une publication passe d'environ 1,8 Mio à environ 72 Mio. Les quatre réglages ci-dessous ne décrivent que la vignette."
cover_max_edge_label = "Côté le plus long de la vignette (px)"
cover_jpeg_quality_label = "Qualité JPEG"
cover_jpeg_quality_help = "JPEG seulement : une pochette à canal alpha est réencodée en PNG, sans perte."
cover_passthrough_max_label = "Ne pas réencoder en dessous de (Kio)"
cover_passthrough_max_help = "Une pochette déjà plus légère que ça, et pas plus large que le côté ci-dessous, part exactement telle quelle : la réencoder ne l'allégerait pas. C'est aussi la règle qui fait accepter sans y toucher une vignette fournie par un greffon."
cover_max_pixels_label = "Plafond de décodage (Mpx)"
cover_max_pixels_help = "Lu dans l'en-tête avant toute allocation : l x h x 4 octets de tampon, donc 16 Mpx font 64 Mio. Un PNG de 200 Kio peut annoncer 30000 x 30000 pixels."
# Ce que le cache contient vraiment, derrière le « (?) » à côté de l'estimation
