# Album covers. One card: the memory the cache may occupy (a budget, not a
# count), then the ceilings on what the core agrees to read, then the
# re-encoding switch and the four settings describing the thumbnail. The
# source ceiling stays live whatever the switch says: it is the only guard
# left when re-encoding is off.
cover_card_title = "Albumcover"
cover_cache_budget_label = "Speicherbudget (MiB)"
cover_cache_budget_help = "Begrenzt die Bytes der aus dem Internet heruntergeladenen Cover und der bereitgehaltenen Vorschaubilder. Ein lokales Cover — eine Datei neben dem Titel oder eine darin eingebettete — kostet nur einen Pfad, nie diese Bytes."
cover_cache_estimate = "Mit {budget} MiB Budget, einer Download-Obergrenze von {download} MiB und Einträgen von höchstens {entry} KiB: im ungünstigsten Fall (alle Cover aus dem Internet) mindestens {floor} Cover gleichzeitig im Speicher, etwa {typical} bei einer Sammlung mit lokalen Covern."
cover_cache_estimate_unlimited = "Im ungünstigsten Fall mindestens {floor} Cover gleichzeitig im Speicher; die Neukodierung ist aus, daher kostet ein lokales Cover nur einen Pfad, und der Cache behält trotzdem höchstens einige Hundert davon."
cover_predicted_weight = "Mit diesen Einstellungen ist ein Vorschaubild etwa {kio} KiB groß."
cover_download_max_label = "Obergrenze für automatische Downloads (MiB)"
cover_download_max_help = "Größtes Cover, das das Gerät von sich aus aus dem Internet herunterlädt, wenn ein Titel angekündigt wird. Unabhängig von der Quell-Obergrenze unten, die auch ein Cover in voller Größe begrenzt, das jemand von Hand anfordert, etwa durch Vergrößern."
cover_source_max_label = "Quell-Obergrenze (MiB)"
cover_source_max_help = "Größtes Cover, das das Gerät liest. Gilt immer, mit oder ohne Neukodierung; begrenzt auf die 20 MiB, die das Plugin-Protokoll garantiert."
cover_rendition_label = "Cover vor dem Senden neu kodieren"
cover_rendition_help = "Ist dies aus, wird das Originalbild unverändert gesendet: Bei einem 20-MiB-Cover steigt die Speicherspitze einer Veröffentlichung von etwa 1,8 MiB auf etwa 72 MiB. Die vier Einstellungen unten beschreiben nur das Vorschaubild."
cover_max_edge_label = "Längste Kante des Vorschaubilds (px)"
cover_jpeg_quality_label = "JPEG-Qualität"
cover_jpeg_quality_help = "Nur JPEG: Ein Cover mit Alphakanal wird verlustfrei als PNG neu kodiert."
cover_passthrough_max_label = "Unverändert lassen unter (KiB)"
cover_passthrough_max_help = "Ein Cover, das bereits kleiner als dieser Wert ist und nicht breiter als die Kante unten, wird genau so gesendet, wie es ist: Neu kodiert würde es nicht kleiner. Auf diese Weise wird auch ein von einem Plugin geliefertes Vorschaubild unverändert übernommen."
cover_max_pixels_label = "Dekodier-Obergrenze (Mpx)"
cover_max_pixels_help = "Wird vor jeder Speicherreservierung aus dem Header gelesen: B x H x 4 Bytes Puffer, also sind 16 Mpx 64 MiB. Ein PNG von 200 KiB kann 30000 x 30000 Pixel behaupten."
# Behind the "(?)" set on the card's own title — no longer beside the estimate,
# where it read as a footnote on that one sentence: what it opens is the state
# of the cache the whole card configures.
# The title says "memory" rather than "what the cache holds": the panel counts
# bytes only, and a local cover, which costs a path, appears nowhere in it.
