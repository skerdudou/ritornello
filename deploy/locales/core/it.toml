# Album covers. One card: the memory the cache may occupy (a budget, not a
# count), then the ceilings on what the core agrees to read, then the
# re-encoding switch and the four settings describing the thumbnail. The
# source ceiling stays live whatever the switch says: it is the only guard
# left when re-encoding is off.
cover_card_title = "Copertine degli album"
cover_cache_budget_label = "Budget di memoria (MiB)"
cover_cache_budget_help = "Limita i byte delle copertine scaricate da internet e delle miniature tenute pronte da servire. Una copertina locale — un file accanto al brano, o incorporato in esso — costa solo un percorso, mai questi byte."
cover_cache_estimate = "Con {budget} MiB di budget, un tetto di download di {download} MiB e voci di al massimo {entry} KiB: almeno {floor} copertine in memoria contemporaneamente nel caso peggiore (tutte da internet), circa {typical} per una libreria di copertine locali."
cover_cache_estimate_unlimited = "Almeno {floor} copertine in memoria contemporaneamente nel caso peggiore; la ricodifica è disattivata, quindi una copertina locale costa solo un percorso, e la cache ne conserva comunque al massimo qualche centinaio."
cover_predicted_weight = "Con queste impostazioni una miniatura pesa circa {kio} KiB."
cover_download_max_label = "Tetto di download automatico (MiB)"
cover_download_max_help = "La copertina più grande che il dispositivo scarica da solo da internet quando viene annunciato un brano. Distinto dal tetto della sorgente qui sotto, che limita anche una copertina a grandezza piena richiesta a mano da un utente, ad esempio ingrandendola."
cover_source_max_label = "Tetto della sorgente (MiB)"
cover_source_max_help = "La copertina più grande che il dispositivo accetta di leggere. Sempre applicato, con o senza ricodifica; limitato ai 20 MiB garantiti dal protocollo dei plugin."
cover_rendition_label = "Ricodifica le copertine prima di inviarle"
cover_rendition_help = "Se disattivato, l'immagine originale viene inviata così com'è: per una copertina di 20 MiB il picco di memoria di una pubblicazione passa da circa 1,8 MiB a circa 72 MiB. Le quattro impostazioni qui sotto descrivono solo la miniatura."
cover_max_edge_label = "Lato più lungo della miniatura (px)"
cover_jpeg_quality_label = "Qualità JPEG"
cover_jpeg_quality_help = "Solo JPEG: una copertina con canale alfa viene ricodificata in PNG, senza perdita."
cover_passthrough_max_label = "Non ricodificare sotto (KiB)"
cover_passthrough_max_help = "Una copertina già più leggera di così, e non più larga del lato qui sotto, viene inviata esattamente com'è: ricodificarla non la alleggerirebbe. È anche il modo in cui una miniatura fornita da un plugin viene accettata senza essere toccata."
cover_max_pixels_label = "Tetto di decodifica (Mpx)"
cover_max_pixels_help = "Letto dall'intestazione prima di qualsiasi allocazione: l x a x 4 byte di buffer, quindi 16 Mpx sono 64 MiB. Un PNG da 200 KiB può dichiarare 30000 x 30000 pixel."
# Behind the "(?)" set on the card's own title — no longer beside the estimate,
# where it read as a footnote on that one sentence: what it opens is the state
# of the cache the whole card configures.
# The title says "memory" rather than "what the cache holds": the panel counts
# bytes only, and a local cover, which costs a path, appears nowhere in it.
cover_cache_open = "Vedi la memoria occupata dalle copertine"
cover_cache_title = "Memoria occupata dalle copertine"
cover_cache_hint = "Rilevata al momento dell'apertura."
# Two lines, and everything held is on one of them: the two weights add up to
# what is occupied. The panel used to list *mechanisms* instead — renditions
# produced, thumbnails supplied, full sizes downloaded — and on a device
# playing radio all three read zero while the memory climbed, because a cover
# announced as a single URL is none of the three.
