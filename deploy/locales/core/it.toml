cover_cache_full_sizes = "Immagini a grandezza piena"
# Encoder runs since boot, and not thumbnails held: this says whether the
# appliance is spending CPU re-encoding, which nothing the cache *holds* can.
cover_cache_renditions = "Ricodifiche"
cover_cache_used = "Occupata"
# The unit travels with its number, never glued to a label: a language places
