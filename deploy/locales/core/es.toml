# Album covers. One card: the memory the cache may occupy (a budget, not a
# count), then the ceilings on what the core agrees to read, then the
# re-encoding switch and the four settings describing the thumbnail. The
# source ceiling stays live whatever the switch says: it is the only guard
# left when re-encoding is off.
cover_card_title = "Carátulas de álbum"
cover_cache_budget_label = "Presupuesto de memoria (MiB)"
cover_cache_budget_help = "Limita los bytes de las carátulas descargadas de internet y de las miniaturas que se mantienen listas para servir. Una carátula local —un archivo junto a la pista o incrustado en ella— solo cuesta una ruta, nunca estos bytes."
cover_cache_estimate = "Con {budget} MiB de presupuesto, un límite de descarga de {download} MiB y entradas de {entry} KiB como máximo: al menos {floor} carátulas en memoria a la vez en el peor caso (todas descargadas de internet), unas {typical} para una biblioteca de carátulas locales."
cover_cache_estimate_unlimited = "Al menos {floor} carátulas en memoria a la vez en el peor caso; la recodificación está desactivada, así que una carátula local solo cuesta una ruta, y aun así la caché conserva unos pocos cientos como máximo."
cover_predicted_weight = "Con estos ajustes, una miniatura pesa unos {kio} KiB."
cover_download_max_label = "Límite de descarga automática (MiB)"
cover_download_max_help = "Carátula más grande que el dispositivo descarga por su cuenta de internet cuando se anuncia una pista. Es distinto del límite de origen de abajo, que también limita una carátula a tamaño completo que un usuario pide a mano, por ejemplo al ampliarla."
cover_source_max_label = "Límite de origen (MiB)"
cover_source_max_help = "Carátula más grande que el dispositivo acepta leer. Se aplica siempre, con o sin recodificación; limitado a los 20 MiB que garantiza el protocolo de complementos."
cover_rendition_label = "Recodificar las carátulas antes de enviarlas"
cover_rendition_help = "Desactivado, la imagen original se envía tal cual: con una carátula de 20 MiB, el pico de memoria de una publicación pasa de unos 1,8 MiB a unos 72 MiB. Los cuatro ajustes siguientes solo describen la miniatura."
cover_max_edge_label = "Lado más largo de la miniatura (px)"
cover_jpeg_quality_label = "Calidad JPEG"
cover_jpeg_quality_help = "Solo JPEG: una carátula con canal alfa se recodifica en PNG, sin pérdida."
cover_passthrough_max_label = "No recodificar por debajo de (KiB)"
cover_passthrough_max_help = "Una carátula que ya pesa menos que esto, y no es más ancha que el lado indicado abajo, se envía exactamente tal cual: recodificarla no la aligeraría. También es así como se acepta sin tocarla una miniatura proporcionada por un complemento."
cover_max_pixels_label = "Límite de decodificación (Mpx)"
cover_max_pixels_help = "Se lee de la cabecera antes de cualquier asignación: an x al x 4 bytes de búfer, así que 16 Mpx son 64 MiB. Un PNG de 200 KiB puede declarar 30000 x 30000 píxeles."
# Behind the "(?)" set on the card's own title — no longer beside the estimate,
# where it read as a footnote on that one sentence: what it opens is the state
# of the cache the whole card configures.
# The title says "memory" rather than "what the cache holds": the panel counts
# bytes only, and a local cover, which costs a path, appears nowhere in it.
