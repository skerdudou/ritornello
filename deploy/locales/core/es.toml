# Whole-sentence phrase keys with named parameters (task 14, language-packs
# chantier; the six `locale_completeness_*` keys added in fix round 1): a
# number concatenated to a label is not translatable, and this is the exact
# trap the chantier's own plan names ("cœur + 3 greffons sur 7"). The six
# `locale_completeness_*` keys annotate one incomplete language in the
# selector, naming `core` when it is among the covered modules and the unit
# ("plugins", or "module" for the none case since fix round 2 — see finding
# E) otherwise — every combination of "core covered?" x "how many others,
# 0 / 1 / many" (the 0/1 split, not a plural suffix, is what keeps the
# French forms grammatical: see `locale_completeness_core_plugin` vs
# `_plugins`). `locale_fallback_result`/`_one`/`_none` are what the fallback
# control shows once a real fallback is chosen — "the only way to know if
# the fallback served" — with the same singular/plural split for the same
# reason; the unit there is "modules" rather than "plugins", since the set
# still uncovered can include `core` itself. `_none` (fix round 2, finding
# C) is the success case, "nothing left in English": before it existed,
# `remaining === 0` suppressed the line entirely, indistinguishable on
# screen from "no fallback chosen" — silence in the one case the line
# exists to report.
locale_completeness_core = "núcleo /{total}"
locale_completeness_core_plugin = "núcleo + 1 complemento /{total}"
locale_completeness_core_plugins = "núcleo + {plugins} complementos /{total}"
locale_completeness_none = "0 módulos /{total}"
locale_completeness_plugin = "1 complemento /{total}"
locale_completeness_plugins = "{plugins} complementos /{total}"
locale_fallback_label = "Idioma de respaldo"
locale_fallback_hint = "El inglés siempre está por debajo de cualquier elección: elegirlo aquí no añade ningún respaldo adicional."
locale_fallback_result_none = "{done} /{total}, ya no queda nada en inglés"
locale_fallback_result_one = "{done} /{total}, 1 módulo sigue en inglés"
locale_fallback_result = "{done} /{total}, {remaining} módulos siguen en inglés"
