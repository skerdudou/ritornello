[[plugin]]
name = "radio"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-radio"

[[plugin]]
name = "cd"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-cd"

# Audio files, read from a local folder or from an authenticated SMB share.
# Its page declares the roots (a folder of the device, a share) and builds the
# playlist; mpv holds that playlist, the plugin drives the index.
#
# Mounting is NOT done by this binary: it runs unprivileged. The page writes
# /etc/ritornello/media-roots.toml (see media-roots.example.toml), then the
# plugin asks systemd to run ritornello-media-mount.service, which is allowed
# for the `ritornello` user — on that one unit only — by
# /etc/polkit-1/rules.d/51-ritornello-media.rules. Without that rule the source
# still works on local roots; shares simply never mount, and the page reports
# systemctl's refusal verbatim.
[[plugin]]
name = "files"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-files"

# `metadata` plugins: they enrich what the active Source is playing (artist,
# title, album) without the Source knowing. Without them, the core only shows
# what the stream announces itself (ICY header), which is empty or unusable on
# most French stations.
#
# DECLARATION ORDER STILL MATTERS, for the plugins that announce the
# `metadata` kind: if two of them answer for the same track, the one declared
# first in this file wins, and a plugin declared lower down never overwrites
# it. This is what makes the display reproducible from one boot to the next,
# regardless of network latency.
#
# The kind itself is no longer declared here: each binary announces its own
# kinds — and whether it serves an admin page — on the core's register socket
# when it starts. This file says what to launch and under which name; the
# binary says what it can do.
#
# `ouifm-metas` needs no configuration: the table of the 21 OUI FM streams is
# embedded in its binary. The /etc/ritornello/ouifm-metas.toml file is
# optional, to fix a mapping gone stale or add one
# (see ouifm-metas.example.toml).
[[plugin]]
name = "ouifm-metas"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-ouifm-metas"

# `radiofrance-metas` likewise needs no configuration: the table of the 74
# Radio France stations is embedded in its binary. Optional file:
# /etc/ritornello/radiofrance-metas.toml (see radiofrance-metas.example.toml).
# The two tables never overlap, so their relative order does not matter here.
[[plugin]]
name = "radiofrance-metas"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-radiofrance-metas"

[[plugin]]
name = "musicbrainz"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-musicbrainz"

[[plugin]]
name = "generic-input"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-generic-input"

[[plugin]]
name = "console"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-console"

# MPD server: exposes the appliance on the local network (port 6600 by
# default) so a phone's MPD client can act as a remote control. Settings live
# in /etc/ritornello/mpd.toml, admin page at /plugins/mpd/. No password: any
# MPD client on the local network can control the appliance — worth knowing
# before exposing this on a network you do not trust.
[[plugin]]
name = "mpd"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-mpd"
