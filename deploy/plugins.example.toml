[[plugin]]
name = "radio"
kind = "source"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-radio"

[[plugin]]
name = "cd"
kind = "source"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-cd"

# `metadata` plugins: they enrich what the active Source is playing (artist,
# title, album) without the Source knowing. Without them, the core only shows
# what the stream announces itself (ICY header), which is empty or unusable on
# most French stations.
#
# DECLARATION ORDER MATTERS HERE, and only here: if two plugins answer for the
# same track, the first one declared wins, and a plugin declared lower down
# never overwrites it. This is what makes the display reproducible from one
# boot to the next, regardless of network latency.
#
# `ouifm-metas` needs no configuration: the table of the 21 OUI FM streams is
# embedded in its binary. The /etc/ritornello/ouifm-metas.toml file is
# optional, to fix a mapping gone stale or add one
# (see ouifm-metas.example.toml).
[[plugin]]
name = "ouifm-metas"
kind = "metadata"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-ouifm-metas"

[[plugin]]
name = "musicbrainz"
kind = "metadata"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-musicbrainz"

[[plugin]]
name = "generic-input"
kind = "input"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-generic-input"

[[plugin]]
name = "console"
kind = "display"
exec = "/usr/local/lib/ritornello/plugins/ritornello-plugin-console"
