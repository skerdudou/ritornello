# Exemple de table de bindings : le preset MCE pre-lie a un recepteur
# infrarouge eHome. Adapter `name` au nom exact du peripherique tel qu'il
# apparait dans la liste deroulante de http://<hote>:8080/plugins/generic-input/
# (ou via `sudo evtest`). Tous les noeuds portant ce nom sont ecoutes.
#
# Les touches "piste suiv./prec." (codes 163/165) sont fusionnees sur
# Next/Prev : deux touches physiques distinctes restent legitimement liees a
# la meme commande, desormais interpretee par la source active (preselection
# pour la radio, piste pour le cd). Un binding qui reference encore
# `NextTrack`/`PrevTrack` (ancien nom) n'est plus valide : il doit etre
# reecrit en `Next`/`Prev`.

[[devices]]
name = "eHome Infrared Transceiver"

[[devices.bindings]]
code = 2
cmd = "Select"
arg = 1

[[devices.bindings]]
code = 3
cmd = "Select"
arg = 2

[[devices.bindings]]
code = 4
cmd = "Select"
arg = 3

[[devices.bindings]]
