# Example bindings table: the MCE preset pre-bound to an eHome infrared
# receiver. Set `name` to the exact device name as it appears in the
# drop-down list of http://<host>:8080/plugins/generic-input/
# (or through `sudo evtest`). Every node bearing this name is listened to.
#
# The "next/prev track" keys (codes 163/165) are merged onto Next/Prev:
# two distinct physical keys legitimately stay bound to the same command,
# now interpreted by the active source (preset for the radio, track for
# the cd). A binding still referencing `NextTrack`/`PrevTrack` (the old
# name) is no longer valid: it must be rewritten as `Next`/`Prev`.

[[devices]]
name = "eHome Infrared Transceiver"

[[devices.bindings]]
code = 2
cmd = "Select"
arg = 1

[[devices.bindings]]
code = 3
cmd = "Select"
arg = 2

