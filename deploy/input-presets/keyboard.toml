# Plain keyboard: digits 1-9 (codes 2-10) to the presets, up/down arrows
# for the volume, right/left arrows for the presets, space play/pause,
# m mute, s source switch, p standby.
#
# CAUTION: generic-input's evdev opening is non-exclusive, so on a Pi with
# a login console on that same keyboard, these bare letters and digits
# also trigger the commands below while typing at the console (notably
# `p` = standby and `m` = mute).

[[bindings]]
code = 2
cmd = "Select"
arg = 1

[[bindings]]
code = 3
cmd = "Select"
arg = 2

[[bindings]]
code = 4
cmd = "Select"
arg = 3

[[bindings]]
code = 5
cmd = "Select"
arg = 4

[[bindings]]
code = 6
cmd = "Select"
arg = 5

[[bindings]]
code = 7
cmd = "Select"
arg = 6

[[bindings]]
code = 8
cmd = "Select"
arg = 7

[[bindings]]
code = 9
cmd = "Select"
arg = 8

[[bindings]]
code = 10
cmd = "Select"
arg = 9

[[bindings]]
code = 103
cmd = "VolumeUp"

[[bindings]]
code = 108
cmd = "VolumeDown"

[[bindings]]
code = 106
cmd = "Next"

[[bindings]]
code = 105
cmd = "Prev"

[[bindings]]
code = 57
cmd = "PlayPause"

[[bindings]]
code = 50
cmd = "Mute"

[[bindings]]
code = 31
cmd = "SourceCycle"

[[bindings]]
code = 25
cmd = "Power"
