# MCE remote (eHome infrared receiver and compatibles).
#
# Measured on real hardware, not transcribed: the previous table came from the
# old hard-coded keymap.rs and its transport codes were never checked against a
# device. The digits arrive twice -- KEY_1..KEY_9 (2..10) and KEY_NUMERIC_1..9
# (513..521) -- because receivers differ on which set they emit; binding both
# costs nothing and spares a support round-trip.
#
# KEY_NUMERIC_0 (512) and KEY_0 (11) both give preset 0, and KEY_NUMERIC_STAR
# (522) gives the "+10" window: both come from the presets work, and a remote
# without them simply never sends those codes.
#
# Next/Prev are bound to KEY_NEXT/KEY_PREVIOUS (407/412) and interpreted by the
# active source -- preset for the radio, track for the cd.

[[bindings]]
code = 2
cmd = "Select"
arg = 1

[[bindings]]
code = 513
cmd = "Select"
arg = 1

