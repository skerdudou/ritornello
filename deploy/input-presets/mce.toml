# MCE remote (eHome infrared receiver and compatibles).
# Transcription of the old hard-coded table (keymap.rs):
# digits 2-10 and 513-521 -> Select(1..9).
#
# The "next/prev track" keys (codes 163/165) are merged onto Next/Prev:
# two distinct physical keys (the "preset" arrows 402/403 and the "track"
# keys 163/165) legitimately stay bound to the same command, now
# interpreted by the active source (preset for the radio, track for
# the cd).

[[bindings]]
code = 2
cmd = "Select"
arg = 1

[[bindings]]
code = 3
cmd = "Select"
arg = 2

[[bindings]]
code = 4
cmd = "Select"
