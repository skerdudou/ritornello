# OUI FM webradio -> metadata identifier mapping.
#
# THIS FILE IS OPTIONAL. The ritornello-plugin-ouifm-metas plugin embeds the
# table of the 21 OUI FM streams (taken from the site's source, see
# crates/ritornello-plugin-ouifm-metas/src/webradios.toml): with nothing
# configured, titles show up for every OUI FM webradio.
#
# It only serves two purposes, the day OUI FM changes something without the
# device having been recompiled:
#
#   1. FIX an entry gone stale — this file's entries are consulted BEFORE the
#      embedded table, so declaring the same `stream` here takes precedence;
#   2. ADD a stream missing from the bundled table.
#
# Copy it to /etc/ritornello/ouifm-metas.toml (or point elsewhere with
# RITORNELLO_OUIFM_METAS). Missing file: the normal case, nothing is logged.
# Invalid file: a warning, and the embedded table carries on alone.
#
# HOW TO COLLECT THE TWO IDENTIFIERS (one minute):
#   1. open https://www.ouifm.fr/player, view the page source;
#   2. look for the `apidata` JavaScript variable: its `radiostreams` and
#      `webradios` arrays list every stream;
#   3. for the desired webradio, note `id` (-> `stream` below) and
#      `idMds` (-> `metas` below).
# Or, more simply, run:
#   node crates/ritornello-plugin-ouifm-metas/scripts/fetch-webradios.mjs
# which regenerates the embedded table from that same source.
#
# Each `urls` entry is matched as a substring of the URL recorded in
# stations.toml: no need to put the whole URL there, whose signed token and
# format vary. A given webradio is broadcast under two URL forms (the
# streams.lesindesradios.fr one and the historical Icecast mount
# ouifmN.ice.infomaniak.ch), hence several fragments per entry.
#
# `metas` is the identifier the metadata feed expects — verified: it is NOT
# the stream identifier, and using the latter yields an empty frame, with
# neither artist nor title.
#
# Careful: a fragment too short captures the wrong stations. `ouifm` would
# match every OUI FM webradio and show the titles of the first one declared.
# Prefer `ouifm3.` or the stream identifier.
#
# Example (these values are already in the embedded table, no need to copy
# them — it is the shape that is being shown):
#
# [[webradio]]
# label = "Oüi FM Classic Rock"
# urls = ["3qhtSltZ27", "ouifm3."]
# metas = "3134161803443976427"
