# Correspondance webradio OUI FM -> identifiant de métadonnées.
#
# CE FICHIER EST FACULTATIF. Le plugin ritornello-plugin-ouifm-metas embarque
# la table des 21 flux OUI FM (relevée de la source du site, voir
# crates/ritornello-plugin-ouifm-metas/src/webradios.toml) : sans rien
# configurer, les titres s'affichent pour toutes les webradios OUI FM.
#
# Il ne sert qu'à deux choses, le jour où OUI FM change quelque chose sans
# qu'on ait recompilé l'appareil :
#
#   1. CORRIGER une entrée devenue fausse — les entrées de ce fichier sont
#      consultées AVANT la table embarquée, donc déclarer le même `stream` ici
#      prend le dessus ;
#   2. AJOUTER un flux absent de la table livrée.
#
# À copier en /etc/ritornello/ouifm-metas.toml (ou pointer ailleurs avec
# RITORNELLO_OUIFM_METAS). Fichier absent : cas normal, rien n'est journalisé.
# Fichier invalide : un avertissement, et la table embarquée continue seule.
#
# COMMENT RELEVER LES DEUX IDENTIFIANTS (une minute) :
#   1. ouvrir https://www.ouifm.fr/player, afficher le source de la page ;
#   2. y chercher la variable JavaScript `apidata` : ses tableaux
#      `radiostreams` et `webradios` listent tous les flux ;
#   3. pour la webradio voulue, relever `id` (-> `stream` ci-dessous) et
#      `idMds` (-> `metas` ci-dessous).
# Ou, plus simplement, lancer :
#   node crates/ritornello-plugin-ouifm-metas/scripts/fetch-webradios.mjs
# qui régénère la table embarquée depuis cette même source.
#
# Chaque entrée de `urls` est cherchée comme sous-chaîne de l'URL enregistrée
# dans stations.toml : inutile d'y mettre l'URL entière, dont le jeton signé et
# le format varient. Une même webradio se diffuse sous deux formes d'URL (celle
# de streams.lesindesradios.fr et le mount Icecast historique
# ouifmN.ice.infomaniak.ch), d'où plusieurs fragments par entrée.
#
# `metas` est l'identifiant attendu par le flux de métadonnées — vérifié : ce
# n'est PAS l'identifiant de flux, et employer ce dernier donne une trame vide,
# sans artiste ni titre.
#
# Attention : un fragment trop court capture les mauvaises stations. `ouifm`
# reconnaîtrait toutes les webradios OUI FM et afficherait les titres de la
# première déclarée. Préférer `ouifm3.` ou l'identifiant de flux.
#
# Exemple (ces valeurs sont déjà dans la table embarquée, inutile de les
# recopier — c'est la forme qui est montrée) :
#
# [[webradio]]
# label = "Oüi FM Classic Rock"
# urls = ["3qhtSltZ27", "ouifm3."]
# metas = "3134161803443976427"
